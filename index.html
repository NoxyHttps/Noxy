/* ---------- app ---------- */
function host(el){
 const S={bots:[],sel:null,tab:'con',logs:{},cur:{},dis:{},files:[],file:null,health:null,cfgOpen:0,live:1};
 let timer=0,dirty=0,busyFix=0;
 const R=()=>el.querySelector('.nh');
 const toast=(t,ms=2600)=>{const m=R();if(!m)return;m.querySelector('.nh-toast')?.remove();const d=document.createElement('div');d.className='nh-toast';d.textContent=t;m.append(d);setTimeout(()=>d.remove(),ms)};
 const bot=()=>S.bots.find(b=>b.id==S.sel);

 /* ---- pantalla de conexión ---- */
 function connect(msg=''){
  const src=document.getElementById('nx-runner-src')?.textContent||'';
  const tk=C.token||Array.from(crypto.getRandomValues(new Uint8Array(16)),x=>x.toString(16).padStart(2,'0')).join('');
  el.innerHTML=`<div class="nh-conn"><div>
   <div class="nh-hero"><span class="ico">${I('host',26)}</span><div><h3>Noxy Host</h3><p>Aloja tus bots de Discord y mantenlos encendidos.</p></div></div>
   <div class="nh-card"><div class="nh-f"><label>URL del runner</label><input id="hu" placeholder="https://mi-runner.up.railway.app" value="${esc(C.url)}" autocapitalize=none spellcheck=false></div>
    <div class="nh-f"><label>Token</label><input id="ht" type="password" placeholder="Token del runner" value="${esc(C.token)}"></div>
    <div class="nh-msg" id="hm">${esc(msg)}</div><button class="nh-b p" id="hc" style="justify-content:center">Conectar</button></div>
   <details class="nh-card"><summary style="cursor:pointer;font-weight:600">¿Aún no tienes un runner?</summary>
    <p style="margin-top:10px">Vercel sirve tu página, pero no puede mantener un bot encendido (sus funciones se apagan a los pocos segundos). El runner es un archivo que corre en cualquier servidor siempre activo.</p>
    <ol class="nh-steps"><li><b>Descarga</b> el runner.</li><li><b>Súbelo</b> a Railway, Render, Fly, un VPS, o pruébalo en tu PC.</li><li>Define <b>RUNNER_TOKEN</b> y <b>ALLOW_ORIGIN</b> (la URL de tu página).</li><li>Pega aquí su URL y el token.</li></ol>
    <div class="nh-code">RUNNER_TOKEN=${esc(tk)} node server.js</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="nh-b" id="hd">${I('dl',16)}Descargar runner</button><button class="nh-b" id="hk">${I('copy',16)}Copiar token</button></div>
    <p class="nh-hint">Tu página va por https, así que la URL del runner también debe ser https (excepto http://localhost).</p></details></div></div>`;
  const q=s=>el.querySelector(s);
  q('#hd').onclick=()=>dl2(new Blob([src],{type:'text/javascript'}),'server.js');
  q('#hk').onclick=()=>{navigator.clipboard?.writeText(tk);q('#hk').textContent='Copiado'};
  q('#hc').onclick=async()=>{const b=q('#hc');C={url:q('#hu').value.trim(),token:q('#ht').value.trim()};if(!/^https?:\/\//.test(C.url)){q('#hm').textContent='Escribe la URL completa (https://…).';return}
   b.disabled=1;b.innerHTML='<span class="nh-spin"></span>Conectando…';
   try{const h=await rq('/health');if(!h.auth)throw Error('El token no coincide.');LS.s('nxhost_cfg',C);S.health=h;start()}catch(e){b.disabled=0;b.textContent='Conectar';q('#hm').textContent=/Failed to fetch|NetworkError|Load failed/i.test(e.message)?'No se pudo llegar al runner. Revisa la URL, que sea https y que ALLOW_ORIGIN incluya esta página.':e.message}}};

 /* ---- panel principal ---- */
 function start(){
  el.innerHTML=`<div class="nh"><aside class="nh-s"><div class="nh-sh"><b>Mis bots</b><button class="nh-ib" id="hn" title="Nuevo bot">${I('plus',18)}</button></div><div class="nh-list" id="hl"></div>
   <div class="nh-sf"><span class="nh-dot ok"></span><div><b>Runner</b><small id="hrm">conectado</small></div><button class="nh-ib" id="hg" title="Cambiar runner">${I('gear',17)}</button></div></aside><section class="nh-m" id="hm"></section></div>`;
  el.querySelector('#hn').onclick=newBot;el.querySelector('#hg').onclick=()=>{clearTimeout(timer);connect()};
  poll(1)}
 const paintList=()=>{const l=el.querySelector('#hl');if(!l)return;
  l.innerHTML=S.bots.length?S.bots.map(b=>{const[t,c]=ST[b.status]||['—','of'];return`<button class="nh-bi ${b.id==S.sel?'on':''}" data-id="${b.id}"><i class="nh-dot ${c}"></i><div><b>${esc(b.name)}</b><small>${b.runtime=='node'?'Node.js':'Python'} · ${t}</small></div></button>`}).join(''):'<p class="nh-hint" style="padding:10px">Aún no tienes bots.</p>';
  l.querySelectorAll('.nh-bi').forEach(x=>x.onclick=()=>{S.sel=x.dataset.id;S.file=null;S.tab='con';S.files=[];paint()});
  const hm=el.querySelector('#hrm');if(hm&&S.health)hm.textContent=`${S.health.platform} · Node ${S.health.node?.replace('v','')}${S.health.python?' · '+S.health.python.replace('Python ','Py '):''}`};
 function paint(){paintList();const m=el.querySelector('#hm');if(!m)return;const b=bot();
  if(!b){m.innerHTML=`<div class="nh-empty"><div><span class="ico" style="width:60px;height:60px;margin:0 auto 14px">${I('host',28)}</span><h3 style="font-size:18px;color:var(--fg);margin-bottom:6px">${S.bots.length?'Elige un bot':'Crea tu primer bot'}</h3><p style="margin-bottom:14px">Sube un .zip o tus archivos .py / .js y enciéndelo.</p><button class="nh-b p" id="hn2">${I('plus',16)}Nuevo bot</button></div></div>`;m.querySelector('#hn2').onclick=newBot;return}
  const[t,c]=ST[b.status]||['—','of'];
  m.innerHTML=`<header class="nh-h"><div class="nh-t"><h2>${esc(b.name)}</h2><span class="nh-chip">${b.runtime=='node'?'Node.js':'Python'}</span><span class="nh-pill" id="hp"><i class="nh-dot ${c}"></i>${t}</span></div>
   <div class="nh-act"><button class="nh-b p" id="ba" ${b.status=='running'||b.status=='installing'?'disabled':''}>${I('play',14)}Iniciar</button><button class="nh-b" id="br">${I('redo',15)}Reiniciar</button><button class="nh-b d" id="bs" ${b.status=='running'||b.status=='installing'?'':'disabled'}>${I('stop',14)}Detener</button></div></header>
   <div class="nh-stats"><div><span>Tiempo activo</span><b id="s1">—</b></div><div><span>Memoria</span><b id="s2">—</b></div><div><span>Reinicios</span><b id="s3">0</b></div><div><span>Archivo de entrada</span><b>${esc(b.entry)}</b></div></div>
   <nav class="nh-tabs">${[['con','Consola'],['fil','Archivos'],['env','Variables'],['set','Ajustes']].map(([k,n])=>`<button data-t="${k}" class="${S.tab==k?'on':''}">${n}</button>`).join('')}</nav><div class="nh-body" id="hb"></div>`;
  const act=a=>async()=>{try{await rq('/bots/'+b.id+'/'+a,{method:'POST'});S.dis[b.id]=S.cur[b.id]||0;poll(1)}catch(e){toast(e.message)}};
  m.querySelector('#ba').onclick=act('start');m.querySelector('#br').onclick=act('restart');m.querySelector('#bs').onclick=act('stop');
  m.querySelectorAll('.nh-tabs button').forEach(x=>x.onclick=()=>{S.tab=x.dataset.t;paint()});
  ({con:tCon,fil:tFil,env:tEnv,set:tSet})[S.tab](m.querySelector('#hb'),b);stats()};
 const stats=()=>{const b=bot();if(!b)return;const g=i=>el.querySelector('#s'+i);if(!g(1))return;g(1).textContent=b.startedAt?ago(Date.now()-b.startedAt):'—';g(2).textContent=b.mem?b.mem+' MB':'—';g(3).textContent=b.restarts;
  const p=el.querySelector('#hp'),[t,c]=ST[b.status]||['—','of'];if(p)p.innerHTML=`<i class="nh-dot ${c}"></i>${t}`;
  const a=el.querySelector('#ba'),s=el.querySelector('#bs'),on=b.status=='running'||b.status=='installing';if(a)a.disabled=on;if(s)s.disabled=!on};

 /* ---- consola + arreglo con IA ---- */
 const lineHTML=l=>`<div class="${l.s=='sys'?'s':l.s=='err'&&ERR.test(l.m)?'e':''}"><i>${new Date(l.t).toTimeString().slice(0,8)}</i><span>${esc(strip(l.m))}</span></div>`;
 function tCon(b$,b){b$.innerHTML=`<div class="nh-err" id="he" hidden><span style="color:#ef4444">${I('bolt',22)}</span><div><b>Se detectó un error en tu bot</b><small>La IA puede revisarlo y proponerte el archivo corregido.</small></div><button class="nh-b p" id="hf">${I('ai',16)}Arreglar con IA</button></div>
  <pre class="nh-log" id="hlog"></pre><div class="nh-lt"><button class="nh-b s" id="hcl">Limpiar vista</button><button class="nh-b s" id="hdl">${I('dl',14)}Descargar log</button><label><input type="checkbox" id="has" checked style="width:auto">Auto-scroll</label></div>`;
  const lg=b$.querySelector('#hlog');lg.innerHTML=(S.logs[b.id]||[]).map(lineHTML).join('')||'<span style="color:var(--mut)">Sin salida todavía. Pulsa Iniciar.</span>';lg.scrollTop=lg.scrollHeight;
  b$.querySelector('#hcl').onclick=()=>{S.logs[b.id]=[];lg.innerHTML='';errBanner()};
  b$.querySelector('#hdl').onclick=()=>dl2(new Blob([(S.logs[b.id]||[]).map(l=>new Date(l.t).toISOString()+' '+strip(l.m)).join('\n')],{type:'text/plain'}),b.name+'.log');
  b$.querySelector('#hf').onclick=fix;errBanner()}
 const errBanner=()=>{const b=bot(),h=el.querySelector('#he');if(!b||!h)return;const L=(S.logs[b.id]||[]).slice(-60),fresh=L.filter(l=>l.n>(S.dis[b.id]||0));
  h.hidden=!(b.status=='crashed'||fresh.some(l=>ERR.test(l.m)))||busyFix};
 async function fix(){const b=bot();if(!b||busyFix)return;busyFix=1;const btn=el.querySelector('#hf');if(btn){btn.disabled=1;btn.innerHTML='<span class="nh-spin"></span>Analizando…'}
  try{const info=await rq('/bots/'+b.id),files=await rq('/bots/'+b.id+'/files'),envv=Object.values(info.env||{}),rd=redactor(envv);
   const logs=(S.logs[b.id]||[]).slice(-160).map(l=>strip(l.m)).join('\n'),names=new Set([b.entry,'requirements.txt','package.json']);
   for(const m of logs.matchAll(/File "([^"]+)"|\(?([\w./\\-]+\.(?:py|js|mjs|cjs)):\d+/g)){const n=(m[1]||m[2]).replace(/\\/g,'/').split('/').pop(),f=files.find(x=>x.path.split('/').pop()==n&&!/site-packages|node_modules|\.venv/.test(x.path));if(f)names.add(f.path)}
   const picks=[...names].filter(n=>files.some(f=>f.path==n)).slice(0,6),ctx=[];
   for(const p of picks){const f=await rq('/bots/'+b.id+'/file?path='+encodeURIComponent(p));if(!f.binary&&f.size<60000)ctx.push({path:p,text:f.content})}
   const SYS='Eres un ingeniero senior que arregla bots de Discord ('+(b.runtime=='node'?'Node.js / discord.js':'Python / discord.py')+'). Recibes el log de error y los archivos del proyecto. Encuentra la causa real y corrígela con el cambio mínimo. Responde SOLO JSON válido, sin markdown: {"diagnostico":"explicación breve en español, 1-3 frases","archivos":[{"ruta":"ruta exacta","contenido":"contenido COMPLETO del archivo corregido"}]}. Si falta una librería, añádela a requirements.txt / package.json. No inventes tokens ni claves; deja intactos los marcadores __SECRET_n__. Si el fallo no se arregla con código (por ejemplo token inválido o intents sin activar en el portal de Discord), devuelve "archivos":[] y explica qué debe hacer el usuario.';
   const USR='LOG:\n'+rd.red(logs).slice(-9000)+'\n\nARCHIVOS:\n'+ctx.map(f=>'=== '+f.path+' ===\n'+rd.red(f.text)).join('\n\n');
   const out=await ai(SYS,USR.slice(0,34000)),j=JSON.parse(out.replace(/^[^{]*/,'').replace(/[^}]*$/,'')),ch=(j.archivos||[]).filter(a=>a&&a.ruta&&typeof a.contenido=='string').map(a=>({path:a.ruta,text:rd.back(a.contenido),old:ctx.find(c=>c.path==a.ruta)?.text||''}));
   review(b,j.diagnostico||'Revisé el error.',ch)}catch(e){toast('La IA no pudo analizarlo: '+e.message,4200)}
  busyFix=0;const x=el.querySelector('#hf');if(x){x.disabled=0;x.innerHTML=I('ai',16)+'Arreglar con IA'}errBanner()}
 function review(b,dx,ch){const o=NX.modal('Arreglo propuesto',`<div style="display:flex;flex-direction:column;gap:12px"><p style="color:var(--fg)">${esc(dx)}</p>${ch.length?ch.map(c=>{const d=diff(c.old,c.text),a=d.filter(x=>x.t=='+').length,r=d.filter(x=>x.t=='-').length;return`<div><div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12.5px"><b style="font-family:ui-monospace,monospace">${esc(c.path)}</b><span style="color:var(--mut)"><span style="color:#4ade80">+${a}</span> <span style="color:#fb7185">−${r}</span></span></div><div class="nh-diff">${d.map(x=>`<div class="${x.t=='+'?'p':x.t=='-'?'m':x.t=='~'?'g':''}">${esc((x.t=='~'?'':x.t+' ')+x.s)}</div>`).join('')}</div></div>`}).join(''):'<p class="nh-hint">No hay cambios de código que aplicar.</p>'}
   <div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="nh-b" id="fx">Descartar</button>${ch.length?'<button class="nh-b p" id="fa">Aplicar y reiniciar</button>':''}</div></div>`);
  o.querySelector('#fx').onclick=()=>o.remove();const fa=o.querySelector('#fa');
  if(fa)fa.onclick=async()=>{fa.disabled=1;fa.innerHTML='<span class="nh-spin"></span>Aplicando…';try{await rq('/bots/'+b.id+'/files',{method:'PUT',body:{files:ch.map(c=>({path:c.path,text:c.text}))}});await rq('/bots/'+b.id+'/restart',{method:'POST'});S.dis[b.id]=S.cur[b.id]||0;o.remove();toast('Arreglo aplicado y bot reiniciado');poll(1)}catch(e){fa.disabled=0;fa.textContent='Aplicar y reiniciar';toast(e.message)}}}

 /* ---- archivos ---- */
 async function loadFiles(){const b=bot();if(!b)return;try{S.files=await rq('/bots/'+b.id+'/files')}catch(e){S.files=[]}}
 function tFil(b$,b){
  b$.innerHTML=`<div class="nh-drop">Suelta aquí tus archivos o .zip</div><div class="nh-files"><div class="nh-tree"><div><button class="nh-b s p" id="fu" style="flex:1;justify-content:center">${I('up',14)}Subir</button><button class="nh-b s" id="fn">${I('plus',14)}Nuevo</button></div><div class="nh-fl" id="ft"></div></div><div class="nh-ed" id="fe"></div></div><input type="file" id="fi" multiple hidden>`;
  const ft=b$.querySelector('#ft'),fe=b$.querySelector('#fe');
  const tree=()=>{ft.innerHTML=S.files.length?S.files.sort((a,c)=>a.path.localeCompare(c.path)).map(f=>`<button class="nh-fi ${S.file&&S.file.path==f.path?'on':''}" data-p="${esc(f.path)}">${I(/\.(py|js|json|txt|md|env|yml|yaml)$/i.test(f.path)?'note':'folder',14)}<span>${esc(f.path)}</span><small>${kb(f.size)}</small></button>`).join(''):'<p class="nh-hint" style="padding:12px">Sin archivos. Sube un .zip o tus .py/.js.</p>';ft.querySelectorAll('.nh-fi').forEach(x=>x.onclick=()=>open(x.dataset.p))};
  const open=async p=>{try{const f=await rq('/bots/'+b.id+'/file?path='+encodeURIComponent(p));S.file=f;tree();edit()}catch(e){toast(e.message)}};
  const edit=()=>{const f=S.file;if(!f){fe.innerHTML='<div class="nh-empty">Elige un archivo para editarlo.</div>';return}
   fe.innerHTML=`<div><b>${esc(f.path)}</b><button class="nh-b s p" id="es" ${f.binary?'disabled':''}>Guardar</button><button class="nh-b s d" id="ed">${I('trash',14)}</button></div>${f.binary?`<div class="nh-empty">Archivo binario (${kb(f.size)}) — no se puede editar aquí.</div>`:'<textarea id="et" spellcheck=false></textarea>'}`;
   const t=fe.querySelector('#et');if(t){t.value=f.content;t.onkeydown=e=>{if((e.ctrlKey||e.metaKey)&&e.key=='s'){e.preventDefault();sv()}if(e.key=='Tab'){e.preventDefault();const a=t.selectionStart;t.setRangeText('    ',a,t.selectionEnd,'end')}}}
   const sv=async()=>{try{await rq('/bots/'+b.id+'/files',{method:'PUT',body:{files:[{path:f.path,text:t.value}]}});f.content=t.value;toast('Guardado')}catch(e){toast(e.message)}};
   fe.querySelector('#es').onclick=sv;fe.querySelector('#ed').onclick=async()=>{if(!confirm('¿Borrar '+f.path+'?'))return;try{await rq('/bots/'+b.id+'/file?path='+encodeURIComponent(f.path),{method:'DELETE'});S.file=null;await loadFiles();tree();edit()}catch(e){toast(e.message)}}};
  b$.querySelector('#fu').onclick=()=>b$.querySelector('#fi').click();
  b$.querySelector('#fi').onchange=e=>ingest(b,[...e.target.files],async()=>{await loadFiles();tree()});
  b$.querySelector('#fn').onclick=()=>{const n=prompt('Nombre del archivo (ej. cogs/music.py)');if(!n)return;rq('/bots/'+b.id+'/files',{method:'PUT',body:{files:[{path:n.trim(),text:''}]}}).then(async()=>{await loadFiles();tree();open(n.trim())}).catch(e=>toast(e.message))};
  ['dragenter','dragover'].forEach(v=>b$.addEventListener(v,e=>{e.preventDefault();b$.classList.add('dz')}));
  ['dragleave','drop'].forEach(v=>b$.addEventListener(v,e=>{e.preventDefault();if(v=='drop'||e.target==b$.querySelector('.nh-drop'))b$.classList.remove('dz')}));
  b$.addEventListener('drop',e=>{const f=[...(e.dataTransfer?.files||[])];if(f.length)ingest(b,f,async()=>{await loadFiles();tree()})});
  tree();edit();loadFiles().then(()=>{if(S.tab=='fil'){tree()}})}
 async function ingest(b,files,done){
  try{let L=[];toast('Leyendo archivos…',9e4);
   for(const f of files){const buf=await f.arrayBuffer();if(/\.zip$/i.test(f.name))L.push(...await unzip(buf));else L.push({path:f.name,data:new Uint8Array(buf)})}
   L=L.filter(x=>!SKIP.test(x.path));const tops=new Set(L.map(x=>x.path.split('/')[0]));
   if(tops.size==1&&L.every(x=>x.path.includes('/')))L.forEach(x=>x.path=x.path.split('/').slice(1).join('/'));
   if(!L.length)throw Error('No encontré archivos útiles.');if(L.reduce((s,x)=>s+x.data.length,0)>60e6)throw Error('Demasiado grande (máx. 60 MB).');
   let batch=[],sz=0,n=0;const flush=async()=>{if(!batch.length)return;await rq('/bots/'+b.id+'/files',{method:'PUT',body:{files:batch}});n+=batch.length;toast(`Subiendo ${n}/${L.length}…`,9e4);batch=[];sz=0};
   for(const x of L){batch.push({path:x.path,b64:b64(x.data)});sz+=x.data.length*1.4;if(sz>3e6)await flush()}await flush();
   const names=L.map(x=>x.path),pref=b.runtime=='node'?['index.js','bot.js','main.js','app.js']:['main.py','bot.py','app.py','index.py'],ok=names.includes(b.entry);
   if(!ok){const e=pref.find(p=>names.includes(p));if(e)await rq('/bots/'+b.id,{method:'PUT',body:{entry:e}})}
   toast(`${L.length} archivo${L.length>1?'s':''} subido${L.length>1?'s':''}`);await poll(1);await done?.()}catch(e){toast(e.message,4200)}}

 /* ---- variables y ajustes ---- */
 async function tEnv(b$,b){let info;try{info=await rq('/bots/'+b.id)}catch(e){b$.innerHTML='<div class="nh-empty">'+esc(e.message)+'</div>';return}
  const rows=Object.entries(info.env||{});if(!rows.length)rows.push(['','']);
  b$.innerHTML=`<div class="nh-card"><h4>Variables de entorno</h4><p>Guarda aquí tu <b>DISCORD_TOKEN</b>. En Python léelo con <code>os.environ["DISCORD_TOKEN"]</code>, en Node con <code>process.env.DISCORD_TOKEN</code>. Estos valores nunca se envían a la IA.</p><div id="er" style="display:flex;flex-direction:column;gap:8px"></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="nh-b s" id="ea">${I('plus',14)}Añadir</button><button class="nh-b s" id="et2">+ DISCORD_TOKEN</button><button class="nh-b s p" id="es2" style="margin-left:auto">Guardar y reiniciar</button></div></div>`;
  const box=b$.querySelector('#er'),add=(k='',v='')=>{const r=document.createElement('div');r.className='nh-row';r.innerHTML=`<input placeholder="NOMBRE" value="${esc(k)}" spellcheck=false autocapitalize=characters><input type="password" placeholder="valor" value="${esc(v)}" spellcheck=false><button class="nh-ib" title="Quitar">${I('x',16)}</button>`;r.querySelector('button').onclick=()=>r.remove();box.append(r)};
  rows.forEach(([k,v])=>add(k,v));b$.querySelector('#ea').onclick=()=>add();b$.querySelector('#et2').onclick=()=>{if(![...box.querySelectorAll('input')].some(i=>i.value=='DISCORD_TOKEN'))add('DISCORD_TOKEN','')};
  b$.querySelector('#es2').onclick=async()=>{const env={};box.querySelectorAll('.nh-row').forEach(r=>{const[k,v]=r.querySelectorAll('input');if(k.value.trim())env[k.value.trim()]=v.value});
   try{await rq('/bots/'+b.id,{method:'PUT',body:{env}});if(b.status=='running')await rq('/bots/'+b.id+'/restart',{method:'POST'});toast('Variables guardadas');poll(1)}catch(e){toast(e.message)}}}
 async function tSet(b$,b){await loadFiles();const ent=S.files.map(f=>f.path).filter(p=>/\.(py|js|mjs|cjs)$/.test(p)&&p.split('/').length<3);
  b$.innerHTML=`<div class="nh-card"><div class="nh-f"><label>Nombre</label><input id="sn" value="${esc(b.name)}" maxlength=40></div>
   <div class="nh-f"><label>Lenguaje</label><div class="nh-seg" id="sr"><button data-r="python" class="${b.runtime=='python'?'on':''}">Python</button><button data-r="node" class="${b.runtime=='node'?'on':''}">Node.js</button></div></div>
   <div class="nh-f"><label>Archivo de entrada</label><select id="se">${[...new Set([b.entry,...ent])].map(p=>`<option ${p==b.entry?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
   <label style="display:flex;gap:10px;align-items:center"><input type="checkbox" id="sa" ${b.autorestart?'checked':''} style="width:auto"><span>Reiniciar automáticamente si se cae</span></label>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="nh-b p" id="ss">Guardar cambios</button><button class="nh-b" id="si">${I('dl',15)}Reinstalar dependencias</button></div></div>
   <div class="nh-card"><h4>Zona peligrosa</h4><p>Se borran los archivos, variables y el historial de este bot.</p><button class="nh-b d" id="sd" style="align-self:flex-start">${I('trash',15)}Eliminar bot</button></div>`;
  let rt=b.runtime;b$.querySelectorAll('#sr button').forEach(x=>x.onclick=()=>{rt=x.dataset.r;b$.querySelectorAll('#sr button').forEach(y=>y.classList.toggle('on',y==x))});
  b$.querySelector('#ss').onclick=async()=>{try{await rq('/bots/'+b.id,{method:'PUT',body:{name:b$.querySelector('#sn').value,runtime:rt,entry:b$.querySelector('#se').value,autorestart:b$.querySelector('#sa').checked}});toast('Cambios guardados');await poll(1)}catch(e){toast(e.message)}};
  b$.querySelector('#si').onclick=async()=>{try{await rq('/bots/'+b.id+'/install',{method:'POST'});S.tab='con';paint()}catch(e){toast(e.message)}};
  b$.querySelector('#sd').onclick=async()=>{if(!confirm('¿Eliminar "'+b.name+'" para siempre?'))return;try{await rq('/bots/'+b.id,{method:'DELETE'});S.sel=null;await poll(1)}catch(e){toast(e.message)}}}
 function newBot(){const o=NX.modal('Nuevo bot',`<div style="display:flex;flex-direction:column;gap:14px"><div class="nh-f"><label>Nombre</label><input id="nn" placeholder="Mi bot de música" maxlength=40></div><div class="nh-f"><label>Lenguaje</label><div class="nh-seg" id="nr"><button data-r="python" class="on">Python</button><button data-r="node">Node.js</button></div></div><div class="nh-msg" id="nm"></div><button class="nh-b p" id="nc" style="justify-content:center">Crear bot</button></div>`);
  let rt='python';o.querySelectorAll('#nr button').forEach(x=>x.onclick=()=>{rt=x.dataset.r;o.querySelectorAll('#nr button').forEach(y=>y.classList.toggle('on',y==x))});
  o.querySelector('#nn').focus();o.querySelector('#nc').onclick=async()=>{try{const n=await rq('/bots',{method:'POST',body:{name:o.querySelector('#nn').value,runtime:rt}});o.remove();S.sel=n.id;S.tab='fil';S.file=null;await poll(1)}catch(e){o.querySelector('#nm').textContent=e.message}}}

 /* ---- sondeo ---- */
 async function poll(now){clearTimeout(timer);if(!el.isConnected||!R())return;
  try{if(!document.hidden||now){S.bots=await rq('/bots');if(!S.sel&&S.bots.length&&!S.manualNone)S.sel=S.bots[0].id;if(S.sel&&!bot())S.sel=S.bots[0]?.id||null;
   const b=bot();if(b){const r=await rq('/bots/'+b.id+'/logs?since='+(S.cur[b.id]||0)),L=S.logs[b.id]=S.logs[b.id]||[];if(r.logs.length){L.push(...r.logs);if(L.length>1500)L.splice(0,L.length-1500)}S.cur[b.id]=r.last;
    const lg=el.querySelector('#hlog');if(lg&&r.logs.length){const stick=el.querySelector('#has')?.checked;if(lg.firstElementChild&&lg.firstElementChild.tagName=='SPAN')lg.innerHTML='';lg.insertAdjacentHTML('beforeend',r.logs.map(lineHTML).join(''));if(stick)lg.scrollTop=lg.scrollHeight}}
   if(now||!el.querySelector('#hm .nh-h'))paint();else{paintList();stats();errBanner()}}}
  catch(e){const h=el.querySelector('#hrm');if(h)h.textContent='sin conexión…'}
  timer=setTimeout(poll,2000)}

 C.url&&C.token?rq('/health').then(h=>{S.health=h;start()}).catch(()=>connect('No pude conectar con tu runner. Revisa que esté encendido.')):connect()}

 setTimeout(()=>{try{if(document.getElementById('shell')&&!document.querySelector('[data-id=host]')&&typeof go=='function'&&!document.getElementById('appv')?.classList.contains('on'))go(document.querySelector('.nv.on')?.dataset.k||'home')}catch(e){}},500)}
