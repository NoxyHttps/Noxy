<style>
:root{--bg:#050404;--bg2:#0d0b0b;--bg3:#161111;--bd:#2b1a1c;--fg:#efe9e7;--mut:#8b807e;--ac:#c8161d;--ac2:#ff2d3a;--f:'Inter',system-ui,sans-serif;--g:'UnifrakturCook','Old English Text MT',serif;--m:ui-monospace,SFMono-Regular,Menlo,monospace}
[data-t=light]{--bg:#f6f2f0;--bg2:#fff;--bg3:#ece6e3;--bd:#00000018;--fg:#1b1413;--mut:#74686a;--ac2:#e11d2a}
[data-t=neon]{--bg:#03000d;--bg2:#0a0420;--bg3:#140836;--bd:#7c3aed55;--fg:#f1e9ff;--mut:#9d8bd0;--ac:#a855f7;--ac2:#22d3ee}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font:400 14px/1.55 var(--f);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;outline:0;width:100%}
input:focus,textarea:focus{border-color:var(--ac)}input::placeholder,textarea::placeholder{color:var(--mut)}
@media(pointer:coarse){input,textarea{font-size:16px}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--bd);border-radius:8px}
@media(prefers-reduced-motion:reduce){*:not(#boot){animation:none!important;transition:none!important}}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px)}}@keyframes fi{from{opacity:0}}@keyframes out{to{opacity:0;transform:scale(.95)}}
.gt{font-family:var(--g);font-weight:700;color:var(--ac2);text-shadow:0 0 26px color-mix(in srgb,var(--ac) 75%,transparent),0 2px 0 color-mix(in srgb,var(--ac) 45%,#000);letter-spacing:.5px}
.wp{background:radial-gradient(640px 460px at 10% 6%,color-mix(in srgb,var(--ac) 30%,transparent),transparent),radial-gradient(560px 460px at 95% 95%,color-mix(in srgb,var(--ac) 24%,transparent),transparent),var(--bg)}
.ico{display:grid;place-items:center;border-radius:24%;background:linear-gradient(150deg,var(--bg3),var(--bg2));border:1px solid var(--bd);color:var(--ac2);box-shadow:0 6px 22px color-mix(in srgb,var(--ac) 18%,transparent)}
.ic{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;color:var(--mut);flex:none}.ic:hover{background:var(--bg3);color:var(--fg)}
.pb{background:var(--ac);color:#fff;font-weight:600;border-radius:14px;padding:12px 16px;box-shadow:0 6px 24px color-mix(in srgb,var(--ac) 40%,transparent)}
.gb{border:1px solid var(--bd);border-radius:14px;padding:12px 16px;color:var(--mut)}.gb:hover{color:var(--fg)}
#boot{position:fixed;inset:0;z-index:999999;background:var(--bg);display:grid;place-content:center;text-align:center;animation:bt 1.5s .1s forwards}#boot .gt{font-size:56px}#boot small{color:var(--mut)}
@keyframes bt{0%,65%{opacity:1}100%{opacity:0;visibility:hidden}}
.ov{position:fixed;inset:0;z-index:50;background:#000b;backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;animation:fi .2s}
.md{width:100%;max-width:400px;background:var(--bg2);border:1px solid var(--bd);border-radius:26px;padding:26px;display:flex;flex-direction:column;gap:12px;animation:pop .22s}.md h3{font-size:24px;font-weight:600}.md p{color:var(--mut)}.md .er{color:var(--ac2);min-height:20px}
.seg{display:flex;background:var(--bg3);border-radius:16px;padding:5px;gap:4px}.seg button{flex:1;padding:12px;border-radius:12px;color:var(--mut)}.seg .on{background:var(--ac);color:#fff}
.av{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;font-weight:600;font-size:13px;flex:none}
/* DESKTOP */
#icons{position:absolute;top:50px;left:18px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,100px);grid-auto-columns:96px;height:calc(100% - 150px);gap:4px}
.di{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 4px;border-radius:14px;font-size:12px;text-align:center;user-select:none}.di:hover,.di:focus-visible{background:#ffffff12}.di .ico{width:54px;height:54px}
#hero{position:absolute;inset:0 0 60px;display:grid;place-content:center;text-align:center;pointer-events:none}#hero .gt{font-size:clamp(70px,11vw,150px);line-height:1}#hero p{color:var(--mut);margin-top:10px}
#wins{position:absolute;inset:34px 0 84px;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;box-shadow:0 30px 90px #000a,0 0 0 1px #0004;overflow:hidden;animation:pop .24s cubic-bezier(.2,.9,.3,1.2);min-width:300px;min-height:200px}
.win.max{inset:0!important;width:auto!important;height:auto!important;border-radius:0}.win.cls{animation:out .16s forwards}.win.mn{display:none}
.tb{display:flex;align-items:center;gap:8px;padding:0 14px;height:42px;background:var(--bg3);border-bottom:1px solid var(--bd);cursor:grab;user-select:none;flex:none}.tb b{flex:1;text-align:center;font-weight:500;font-size:13px;color:var(--mut);margin-right:48px}
.tb button{width:13px;height:13px;border-radius:50%}.tb .x{background:#ff5f57}.tb .n{background:#febc2e}.tb .z{background:#28c840}
.wb{flex:1;overflow:auto;position:relative;min-height:0;display:flex;flex-direction:column}.wb>*{flex:none}.wb>.ai,.wb>.term{flex:1;min-height:0}
#bar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;height:66px;padding:0 14px!important;display:flex;align-items:center;gap:8px;padding:0 8px;background:color-mix(in srgb,var(--bg2) 80%,transparent);backdrop-filter:blur(20px);border:1px solid var(--bd);border-radius:18px}
.st{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:12px;background:var(--ac);color:#fff;font-weight:600}.st .gt{font-size:20px;color:#fff;text-shadow:none}
#tasks{display:flex;gap:10px}.tk{position:relative;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,var(--bg3),var(--bg2));border:1px solid var(--bd);color:var(--ac2);transition:transform .15s}.tk:hover{transform:translateY(-7px) scale(1.14)}.tk.run:after{content:'';position:absolute;bottom:-7px;width:5px;height:5px;border-radius:50%;background:var(--ac2)}.tk.on{border-color:var(--ac)}
#clock{font-size:12px;color:var(--mut);padding:0 8px}.tp{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px;border-radius:12px;color:var(--mut);font-size:12px}.tp:hover{background:var(--bg3);color:var(--fg)}
#menu{position:absolute;left:10px;top:38px;width:290px;padding:10px;background:var(--bg2);border:1px solid var(--bd);border-radius:20px;display:none;animation:pop .18s;box-shadow:0 20px 60px #000a}#menu.on{display:block}
#menu .gt{font-size:26px;padding:4px 10px 8px}#menu button{display:flex;gap:12px;align-items:center;width:100%;padding:8px 10px;border-radius:12px;text-align:left}#menu button:hover{background:var(--bg3)}#menu .ico{width:32px;height:32px}
/* MOBILE */
#store{position:fixed;left:0;right:0;top:0;height:var(--vh,100dvh);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
#sh{padding:14px 18px 6px}.row{display:flex;justify-content:space-between;align-items:center}.row>div:first-child{min-width:0}.row .gt{font-size:clamp(24px,7.6vw,32px);white-space:nowrap;letter-spacing:-.5px;word-spacing:-.18em;line-height:1.1}.row small{color:var(--mut)}.rr{display:flex;gap:2px}
.sr{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--bg3);border:1px solid var(--bd);border-radius:16px;color:var(--mut);margin-top:12px}.sr input{background:none;border:0;padding:12px 0}
#tabs{display:flex;gap:8px;padding:10px 18px;overflow-x:auto;flex:none}#tabs button{padding:8px 16px;border-radius:99px;background:var(--bg3);border:1px solid var(--bd);white-space:nowrap;color:var(--mut)}#tabs .on{background:var(--ac);border-color:var(--ac);color:#fff}
#grid{flex:1;min-height:0;overflow:auto;padding:4px 18px calc(24px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.feat{display:block;width:100%;text-align:left;padding:22px;margin:6px 0 10px;border-radius:24px;border:1px solid var(--bd);background:radial-gradient(300px 200px at 100% 0,color-mix(in srgb,var(--ac) 55%,transparent),transparent),var(--bg2);animation:pop .3s}.feat small{color:var(--mut)}.feat .gt{display:block;font-size:44px;line-height:1.1;margin:4px 0}.feat p{color:var(--mut);margin-bottom:14px}
.card{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--bd);animation:pop .3s backwards}.card .ico{width:60px;height:60px;flex:none}.card div{flex:1;min-width:0}.card b{display:block;font-weight:600}.card small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.get{padding:7px 18px;border-radius:99px;background:var(--bg3);border:1px solid var(--bd);font-weight:600;color:var(--ac2)}
.pg{position:fixed;left:0;right:0;top:0;height:var(--vh,100dvh);background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.8,.2,1);z-index:5}.pg.on{transform:none}

.pg .wb{padding-bottom:0}.pg .wb:has(>.ai){overflow:hidden}
.det{padding:22px}.det .top{display:flex;gap:16px;align-items:center}.det .ico{width:92px;height:92px}.det h2{font-size:24px;font-weight:600}.det small{color:var(--mut)}
.det .btns{display:flex;gap:10px;margin:20px 0}.det .btns button{flex:1}
.shots{display:flex;gap:10px;overflow-x:auto;margin:6px -22px 18px;padding:0 22px}.shots i{flex:none;width:150px;height:260px;border-radius:20px;border:1px solid var(--bd);background:radial-gradient(120px 120px at 50% 0,color-mix(in srgb,var(--ac) 35%,transparent),transparent),var(--bg2);display:grid;place-items:center;color:var(--ac2)}

/* APPS */
.pad{padding:22px}.pad h3{font-size:22px;font-weight:600;margin-bottom:6px}.pad p{color:var(--mut);margin-bottom:12px}
.bar{height:6px;border-radius:9px;background:var(--bg3);margin:5px 0 14px}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ac),var(--ac2))}
.term{padding:14px;font:13px/1.6 var(--m);background:#000;color:#e9dcdc;overflow:auto;white-space:pre-wrap}.term input{background:none;border:0;padding:0;font:inherit;color:var(--ac2);display:inline;width:70%;border-radius:0}.term .p{color:var(--ac2)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:16px}.calc output{grid-column:1/5;text-align:right;font:300 36px var(--m);padding:10px;min-height:64px;overflow:hidden}.calc button{padding:15px 0;border-radius:14px;background:var(--bg3);border:1px solid var(--bd);font-size:18px}.calc .o{color:var(--ac2)}.calc .e{background:var(--ac);color:#fff}
.todo li{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);list-style:none;cursor:pointer}.todo .d{text-decoration:line-through;color:var(--mut)}

/* PLONT AI */
.ai{display:flex;position:relative;overflow:hidden;background:var(--bg)}
.ai aside{width:270px;background:var(--bg2);border-right:1px solid var(--bd);padding:14px;display:flex;flex-direction:column;gap:10px;flex:none;z-index:3;transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:max(14px,env(safe-area-inset-bottom))}
.sb1{display:flex;align-items:center;gap:8px;padding:2px 4px 6px}.lg{font-size:30px;line-height:1}.badge{font-size:11px;color:var(--mut);border:1px solid var(--bd);border-radius:8px;padding:1px 8px}

.ai .sr{margin:0;border-radius:12px}.ai .sr input{padding:9px 0}.lb{font-size:12px;color:var(--mut);padding:6px 8px 2px}
.cl{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}.ci{display:flex;align-items:center;gap:2px;padding:2px 2px 2px 12px;border-radius:12px;color:var(--mut);cursor:pointer}.ci span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 0}.ci .ic{width:28px;height:28px;display:none}.ci:hover .ic,.ci.on .ic{display:grid}.ci:hover,.ci.on{background:var(--bg3);color:var(--fg)}
.ai .ac{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--bd);border-radius:14px;color:var(--mut);text-align:left}.ai .ac:hover{color:var(--fg);background:var(--bg3)}
.ai section{flex:1;display:flex;flex-direction:column;min-width:0}.ah{display:flex;align-items:center;gap:6px;padding:8px 10px;flex:none}.nb2{font-size:26px}
.mp{position:relative}.mpb{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;font-weight:500;max-width:200px}.mpb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mpb:hover{background:var(--bg3)}
.mpl{position:absolute;top:44px;left:0;width:290px;max-height:60vh;overflow:auto;background:var(--bg2);border:1px solid var(--bd);border-radius:16px;padding:6px;display:none;z-index:6;box-shadow:0 20px 60px #000a}.mp.open .mpl{display:block;animation:pop .15s}
.mpl button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:10px 12px;border-radius:10px;text-align:left;font-size:13px}.mpl button:hover,.mpl .on{background:var(--bg3)}
.ai:not(.nar) .mb,.ai:not(.nar) .nb2,.ai:not(.nar) .nw,.ai:not(.nar) .us{display:none}
.bk{display:none;position:absolute;inset:0;background:#000a;z-index:2;animation:fi .2s}
.ai.nar aside{position:absolute;inset:0 auto 0 0;width:min(84%,320px);transform:translateX(-102%)}.ai.nar.open aside{transform:none}.ai.nar.open .bk{display:block}

.ms{flex:1;min-height:0;overflow:auto;padding:12px max(16px,calc((100% - 760px)/2)) 20px;-webkit-overflow-scrolling:touch}.ms>*{margin-left:0;margin-right:0}
.m{white-space:pre-wrap;word-break:break-word;margin-bottom:18px;animation:pop .2s;line-height:1.65}.m.u{width:fit-content;max-width:min(560px,88%);margin-left:auto;background:var(--bg3);border:1px solid var(--bd);padding:10px 16px;border-radius:20px 20px 6px 20px}
.m code{font-family:var(--m);background:var(--bg3);padding:1px 6px;border-radius:6px;font-size:.9em}.cb{white-space:normal;margin:10px 0;border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#000}.ch{display:flex;justify-content:space-between;padding:6px 12px;background:var(--bg3);font-size:12px;color:var(--mut)}.cp:hover{color:var(--fg)}.cb pre{white-space:pre;overflow:auto;padding:12px;font:12.5px/1.6 var(--m);color:#eadcdc}
.ma{display:flex;gap:2px;margin:-12px 0 16px -8px}.ma .ic{width:30px;height:30px}

.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.chips button{padding:10px 20px;border-radius:99px;border:1px solid var(--bd);background:var(--bg2);color:var(--fg)}.chips button:hover{border-color:var(--ac)}

.ib{padding:8px 14px calc(10px + env(safe-area-inset-bottom));max-width:792px;width:100%;margin:0 auto;flex:none}.ib small{display:block;text-align:center;color:var(--mut);font-size:12px;margin-top:8px}
.bx{display:flex;align-items:flex-end;gap:6px;padding:8px;background:var(--bg2);border:1px solid var(--bd);border-radius:28px}.bx:focus-within{border-color:color-mix(in srgb,var(--ac) 60%,transparent)}
.bx textarea{resize:none;border:0;background:none;padding:9px 4px;max-height:150px;line-height:1.5}.bx .sn{width:42px;height:42px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;flex:none;box-shadow:0 4px 20px color-mix(in srgb,var(--ac) 50%,transparent)}
.dots{display:inline-flex;gap:5px;padding:6px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:bl 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}@keyframes bl{50%{opacity:.2}}
.gt{background:linear-gradient(180deg,#ff7a82 0%,var(--ac2) 42%,var(--ac) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 20px color-mix(in srgb,var(--ac) 55%,transparent)) drop-shadow(0 2px 0 #0008)}
.st .gt{background:none;filter:none}
#hero small{letter-spacing:.45em;color:var(--mut);font-size:12px;margin-bottom:6px}
.di{text-shadow:0 1px 6px #000a}.di:hover{transform:translateY(-2px);transition:.15s}
.hp,.mr{display:flex;align-items:center}.mr{padding:0 6px 6px}.ai:not(.nar) .mr,.ai:not(.nar) .b2,.ai:not(.nar) .pt,.ai:not(.nar) .dx{display:none}

.ai .bkb{text-align:left}.ai.nar .mpb{background:var(--bg3);border:1px solid var(--bd);padding:6px 12px;font-size:13px}

.ban{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--bd);border-radius:20px;background:var(--bg2);margin-bottom:8px}.ban div{flex:1;min-width:0}.ban small{display:block;color:var(--mut)}
select{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;width:100%;margin-bottom:8px;outline:0}
textarea.cd{font:13px/1.5 var(--m);min-height:200px;white-space:pre;overflow:auto}
.mc.rec{background:var(--ac);color:#fff;animation:bl 1s infinite}.m.u img{display:block;max-width:100%;max-height:220px;border-radius:12px;margin-bottom:6px}
.iss{border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-top:8px;background:var(--bg3)}.iss b{font-size:12px;letter-spacing:.04em;text-transform:uppercase}.sev-error{border-left:3px solid #ff3b46}.sev-warning{border-left:3px solid #f5a524}.sev-info{border-left:3px solid #4ea1ff}.ok{color:#3ddc84}.bad{color:#ff5a64}
