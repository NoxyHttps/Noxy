#auth.lw .af{background:color-mix(in srgb,var(--bg2) 74%,transparent)!important;
  backdrop-filter:blur(18px) saturate(1.25);-webkit-backdrop-filter:blur(18px) saturate(1.25);
  border:1px solid color-mix(in srgb,var(--ac2) 30%,var(--bd))!important;
  box-shadow:0 30px 90px #0009,0 0 0 1px #0003!important}
html.lite #auth.lw .af,#auth.lw.nb .af{backdrop-filter:none;-webkit-backdrop-filter:none;background:color-mix(in srgb,var(--bg2) 90%,transparent)!important}
@media(pointer:coarse){#auth.lw .af{backdrop-filter:none;-webkit-backdrop-filter:none;background:color-mix(in srgb,var(--bg2) 90%,transparent)!important}}
@media(max-width:859px){
  #auth.lw .aright{padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
  #auth.lw .af{padding:24px!important;border-radius:22px!important}
}

/* ---------- fondos y efectos dentro de las apps (Plont AI, terminal, herramientas) ---------- */
html.app-open #shell{visibility:hidden!important}
html.app-open #appv{visibility:visible!important}
html.app-open #shell>*:not(#appv){pointer-events:none}
#nxlw-bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* ---------- app instalada: Windows (Electron) ---------- */
html.is-electron #head{-webkit-app-region:drag;padding-right:150px;min-height:48px}
html.is-electron #head button,html.is-electron #head input,html.is-electron #head a,html.is-electron .apb{-webkit-app-region:no-drag}
html.is-electron .apb{padding-right:150px;-webkit-app-region:drag}
html.is-electron .apb button{-webkit-app-region:no-drag}
html.is-electron ::-webkit-scrollbar{width:10px;height:10px}
html.is-electron,html.is-electron body{user-select:none}
html.is-electron input,html.is-electron textarea,html.is-electron .term,html.is-electron .m,html.is-electron pre,html.is-electron code{user-select:text}

/* ---------- app instalada: Android (Capacitor) ---------- */
html.is-capacitor,html.is-capacitor body{overscroll-behavior:none}
html.is-capacitor #head{padding-top:calc(14px + env(safe-area-inset-top))}
html.is-capacitor{-webkit-user-select:none;user-select:none}
html.is-capacitor input,html.is-capacitor textarea,html.is-capacitor .term,html.is-capacitor .m,html.is-capacitor pre,html.is-capacitor code{-webkit-user-select:text;user-select:text}

/* ---------- selector de tema base en el personalizador ---------- */
.nxthm{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.nxthm button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;border:2px solid var(--bd);background:var(--bg3);font-size:12px}
.nxthm button i{display:block;width:100%;height:22px;border-radius:7px;border:1px solid #ffffff22}
.nxthm button.on{border-color:var(--ac2)}
.nxclean{display:flex;gap:8px;flex-wrap:wrap}
.nxclean .gb{display:inline-flex;align-items:center;gap:8px;padding:10px 14px}
.nxclean .gb i{color:var(--ac2)}

/* ---------- terminal Noxy ---------- */
.nterm{display:flex;flex-direction:column;height:100%;min-height:0;background:#07090c;color:#d7dde5;font:13px/1.55 ui-monospace,"JetBrains Mono","Cascadia Mono",SFMono-Regular,Menlo,Consolas,monospace}
.nterm .nt-bar{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #ffffff14;background:#0b0e13;flex:none;overflow-x:auto}
.nterm .nt-bar select{width:auto;margin:0;padding:5px 10px;border-radius:9px;background:#141922;border:1px solid #ffffff1f;color:#d7dde5;font:12px system-ui,sans-serif}
.nterm .nt-bar button{padding:5px 10px;border-radius:9px;border:1px solid #ffffff1f;color:#aab4c0;font:12px system-ui,sans-serif;white-space:nowrap}
.nterm .nt-bar button:hover{color:#fff;border-color:var(--ac2)}
.nterm .nt-bar .nt-st{margin-left:auto;font:11px system-ui,sans-serif;color:#7d8896;white-space:nowrap}
.nterm .nt-out{flex:1;min-height:0;overflow:auto;padding:10px 12px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;-webkit-overflow-scrolling:touch;cursor:text}
.nterm .nt-ln{display:block;min-height:1.55em}
.nterm .nt-row{display:flex;gap:8px;align-items:flex-start;padding:2px 12px 10px;flex:none}
.nterm .nt-ps{white-space:pre;color:#4ade80;flex:none}
.nterm .nt-in{flex:1;min-width:0;background:none!important;border:0!important;border-radius:0!important;padding:0!important;margin:0;font:inherit;color:#fff;outline:0;box-shadow:none!important;caret-color:var(--ac2);height:auto}
.nterm .nt-keys{display:none;gap:6px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-top:1px solid #ffffff14;background:#0b0e13;overflow-x:auto;flex:none}
.nterm .nt-keys button{flex:none;min-width:42px;padding:8px 10px;border-radius:9px;background:#141922;border:1px solid #ffffff1f;color:#cdd6e0;font:12px ui-monospace,Menlo,monospace}
@media(pointer:coarse){.nterm .nt-keys{display:flex}}
.nterm .b{font-weight:700}.nterm .dim{opacity:.6}.nterm .ul{text-decoration:underline}
.nterm a{color:#7cc4ff}
#appv .wb>.nterm,.wb>.nterm{flex:1;min-height:0;max-width:none}
.nterm .nt-ln:empty{display:none}

/* =====================================================================
   DISTRIBUCIÓN DE LA HOME  (html[data-lay]) — categorías .nh-c y herramientas .nh-t
   ===================================================================== */
.nxlay{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.nxlay button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:12px;border:2px solid var(--bd);background:var(--bg3);font-size:12px;color:var(--mut)}
.nxlay button.on{border-color:var(--ac2);color:var(--fg)}
.nxlay button.on svg{color:var(--ac2)}

/* lista */
html[data-lay=lista] .nh-cards,html[data-lay=lista] .nh-g{grid-template-columns:1fr;gap:8px}
html[data-lay=lista] .nh-c{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"i t c" "i s c";column-gap:14px;row-gap:0;align-items:center;min-height:0;padding:12px 16px}
html[data-lay=lista] .nh-ch{display:contents}
html[data-lay=lista] .nh-ci{grid-area:i;width:42px;height:42px}
html[data-lay=lista] .nh-cc{grid-area:c;align-items:flex-end}
html[data-lay=lista] .nh-c>strong{grid-area:t;align-self:end}
html[data-lay=lista] .nh-c>small{grid-area:s;align-self:start}
html[data-lay=lista] .nh-cp,html[data-lay=lista] .nh-c>em{display:none}
html[data-lay=lista] .nh-t{padding:10px 14px}
html[data-lay=lista] .nh-tx small{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* compacta: solo icono y nombre */
html[data-lay=compacta] .nh-cards{grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
html[data-lay=compacta] .nh-g{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
html[data-lay=compacta] .nh-c{min-height:0;align-items:center;text-align:center;padding:14px 8px;gap:2px}
html[data-lay=compacta] .nh-ch{flex-direction:column;gap:8px;margin:0}
html[data-lay=compacta] .nh-cc{align-items:center}
html[data-lay=compacta] .nh-cc small,html[data-lay=compacta] .nh-c>small,html[data-lay=compacta] .nh-cp,html[data-lay=compacta] .nh-c>em,html[data-lay=compacta] .nh-t>em,html[data-lay=compacta] .nh-tx small{display:none}
html[data-lay=compacta] .nh-t{flex-direction:column;text-align:center;padding:14px 6px;gap:8px;justify-content:flex-start}
html[data-lay=compacta] .nh-tx b{font-size:12px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* mosaico (bento) */
html[data-lay=mosaico] .nh-cards{grid-template-columns:repeat(4,1fr);grid-auto-flow:dense;gap:10px}
html[data-lay=mosaico] .nh-c:nth-child(1){grid-column:span 2;grid-row:span 2;min-height:280px}
html[data-lay=mosaico] .nh-c:nth-child(2),html[data-lay=mosaico] .nh-c:nth-child(5){grid-column:span 2}
html[data-lay=mosaico] .nh-g{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-flow:dense;gap:10px}
html[data-lay=mosaico] .nh-t{flex-direction:column;align-items:flex-start;gap:12px;min-height:118px;padding:16px}
html[data-lay=mosaico] .nh-t:nth-child(8n+1){grid-column:span 2;grid-row:span 2;min-height:250px}
html[data-lay=mosaico] .nh-t:nth-child(8n+5){grid-column:span 2}
html[data-lay=mosaico] .nh-t>em{position:absolute;top:12px;right:14px}
html[data-lay=mosaico] .nh-tx small{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
@media(max-width:700px){
  html[data-lay=mosaico] .nh-cards{grid-template-columns:1fr 1fr}
  html[data-lay=mosaico] .nh-c:nth-child(1){grid-column:span 2;grid-row:auto;min-height:170px}
  html[data-lay=mosaico] .nh-c:nth-child(2),html[data-lay=mosaico] .nh-c:nth-child(5){grid-column:auto}
  html[data-lay=mosaico] .nh-g{grid-template-columns:1fr 1fr}
  html[data-lay=mosaico] .nh-t:nth-child(8n+1){grid-column:span 2;grid-row:auto;min-height:130px}
  html[data-lay=mosaico] .nh-t:nth-child(8n+5){grid-column:auto}
}

/* carrusel horizontal */
html[data-lay=carrusel] .nh-cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:2px 2px 12px;scrollbar-width:thin}
html[data-lay=carrusel] .nh-c{flex:0 0 min(78%,300px);scroll-snap-align:start;min-height:210px}
html[data-lay=carrusel] .nh-g{grid-template-columns:none;grid-template-rows:repeat(4,auto);grid-auto-flow:column;grid-auto-columns:min(84%,310px);overflow-x:auto;scroll-snap-type:x proximity;padding:2px 2px 12px;scrollbar-width:thin}
html[data-lay=carrusel] .nh-t{scroll-snap-align:start}

/* tabla: filas numeradas */
html[data-lay=tabla] .nh-cards,html[data-lay=tabla] .nh-g{grid-template-columns:1fr;gap:0;border:1px solid var(--bd);border-radius:var(--r2);overflow:hidden;counter-reset:nx;background:var(--bg2)}
html[data-lay=tabla] .nh-c,html[data-lay=tabla] .nh-t{border:0;border-bottom:1px solid var(--bd);border-radius:0;background:transparent;counter-increment:nx;box-shadow:none}
html[data-lay=tabla] .nh-c:last-child,html[data-lay=tabla] .nh-t:last-child{border-bottom:0}
html[data-lay=tabla] .nh-t:before{content:counter(nx,decimal-leading-zero);flex:none;width:26px;font:12px var(--m);color:var(--mut)}
html[data-lay=tabla] .nh-t{padding:9px 14px;gap:12px}
html[data-lay=tabla] .nh-ti{width:34px;height:34px}
html[data-lay=tabla] .nh-tx small{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
html[data-lay=tabla] .nh-c{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"i t c" "i s c";column-gap:14px;align-items:center;min-height:0;padding:12px 16px}
html[data-lay=tabla] .nh-ch{display:contents}
html[data-lay=tabla] .nh-ci{grid-area:i;width:38px;height:38px}
html[data-lay=tabla] .nh-cc{grid-area:c;align-items:flex-end}
html[data-lay=tabla] .nh-c>strong{grid-area:t;align-self:end}
html[data-lay=tabla] .nh-c>small{grid-area:s;align-self:start}
html[data-lay=tabla] .nh-cp,html[data-lay=tabla] .nh-c>em{display:none}

/* grande */
html[data-lay=grande] .nh-cards{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
html[data-lay=grande] .nh-c{min-height:240px;padding:24px}
html[data-lay=grande] .nh-ci{width:64px;height:64px}
html[data-lay=grande] .nh-c>strong{font-size:22px}
html[data-lay=grande] .nh-g{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
html[data-lay=grande] .nh-t{flex-direction:column;align-items:flex-start;gap:16px;padding:22px;min-height:170px}
html[data-lay=grande] .nh-ti{width:56px;height:56px}
html[data-lay=grande] .nh-tx b{font-size:17px}
html[data-lay=grande] .nh-t>em{position:absolute;top:16px;right:18px}
html.lite[data-lay] .nh-c,html.lite[data-lay] .nh-t{animation:none}

/* =====================================================================
   LOGIN / REGISTRO — rediseño
   ===================================================================== */
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}
@keyframes nxSpin{to{--ang:360deg}}
@keyframes nxIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes nxMq{to{transform:translateX(-50%)}}
@keyframes nxShim{0%{transform:translateX(-120%)}60%,100%{transform:translateX(120%)}}
@keyframes nxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes nxIntro{0%{opacity:0;letter-spacing:.6em}30%{opacity:1}100%{opacity:1;letter-spacing:.02em}}
@keyframes nxOut{to{opacity:0;visibility:hidden}}

#auth .aleft{padding:44px 52px!important;gap:28px;justify-content:space-between;min-width:0;overflow:hidden}
#auth .aleft .brand{display:flex;align-items:center;gap:12px;font-size:26px!important;font-weight:700;letter-spacing:-.02em}
#auth .bmark{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 0 28px color-mix(in srgb,var(--ac) 55%,transparent);position:relative;flex:none}
#auth .bmark:after{content:"";position:absolute;inset:8px;border-radius:5px;border:2px solid #fff;border-right-color:transparent;border-bottom-color:transparent;transform:rotate(45deg)}
#auth .ahero{display:flex;flex-direction:column;gap:18px;max-width:560px}
#auth .aeb{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;margin:0!important;padding:6px 12px;border-radius:999px;font:600 12px var(--m);letter-spacing:.04em;text-transform:uppercase;color:var(--ac2);background:color-mix(in srgb,var(--ac) 14%,transparent);border:1px solid color-mix(in srgb,var(--ac2) 30%,transparent)}
#auth .aeb:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ac2);box-shadow:0 0 10px var(--ac2)}
#auth .aleft h2{font-size:clamp(32px,3.6vw,52px)!important;line-height:1.04;letter-spacing:-.035em;font-weight:700;max-width:none}
#auth .grad{background:linear-gradient(100deg,var(--ac2),#fff 45%,var(--ac) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nxGrad 6s ease-in-out infinite alternate}
@keyframes nxGrad{to{background-position:100% 0}}
#auth .asub{color:var(--mut);margin:0!important;max-width:470px;font-size:15.5px;line-height:1.55}
#auth .astats{display:flex;gap:10px;flex-wrap:wrap}
#auth .astats div{display:flex;flex-direction:column;gap:2px;padding:12px 16px;min-width:96px;border-radius:14px;background:color-mix(in srgb,var(--bg2) 58%,transparent);border:1px solid color-mix(in srgb,var(--ac2) 18%,var(--bd))}
#auth .astats b{font:700 24px var(--f);letter-spacing:-.02em}
#auth .astats span{font-size:11.5px;color:var(--mut)}
#auth .feat{display:grid;gap:10px;list-style:none;margin:0;padding:0}
#auth .feat li{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--bg2) 50%,transparent);border:1px solid var(--bd);transition:transform .25s,border-color .25s}
#auth .feat li:hover{transform:translateX(4px);border-color:color-mix(in srgb,var(--ac2) 45%,var(--bd))}
#auth .feat li svg{flex:none;color:var(--ac2);margin-top:2px}
#auth .feat span{font-size:13.5px;color:var(--mut);line-height:1.45}
#auth .feat b{display:block;color:var(--fg);font-size:14px;margin-bottom:1px}
#auth .amq{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
#auth .amq div{display:flex;gap:10px;width:max-content;animation:nxMq 42s linear infinite}
#auth .amq span{white-space:nowrap;padding:7px 13px;border-radius:999px;font-size:12.5px;color:var(--mut);background:color-mix(in srgb,var(--bg2) 60%,transparent);border:1px solid var(--bd)}
#auth .acp{color:var(--mut);font-size:12px}

#auth .aright{position:relative;padding:28px}
#auth .af{position:relative;width:min(452px,100%)!important;padding:30px 30px 26px!important;border-radius:24px!important;isolation:isolate;overflow:hidden}
#auth .af:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.5px;z-index:-1;pointer-events:none;
  background:conic-gradient(from var(--ang),transparent 0 62%,var(--ac2) 80%,#fff 86%,transparent 92%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:nxSpin 5s linear infinite}
#auth .af:after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;border-radius:inherit;background:radial-gradient(360px 260px at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--ac) 22%,transparent),transparent 70%)}
#auth .af>*{animation:nxIn .55s both;animation-delay:calc(var(--k,0)*55ms)}
#auth .af h3{font-size:27px;letter-spacing:-.03em}
#auth .atabs{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;margin:0 0 18px;border-radius:14px;background:color-mix(in srgb,var(--bg) 70%,transparent);border:1px solid var(--bd)}
#auth .atabs button{position:relative;z-index:1;padding:10px 0;font:600 13.5px var(--f);color:var(--mut);border-radius:10px;transition:color .25s}
#auth .atabs button.on{color:#fff}
#auth .atabs i{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 6px 20px color-mix(in srgb,var(--ac) 45%,transparent);transition:transform .35s cubic-bezier(.3,1.3,.5,1)}
#auth .atabs[data-m=up] i{transform:translateX(100%)}
#auth .af input:not([type=checkbox]){background:color-mix(in srgb,var(--bg) 72%,transparent)!important;border:1px solid var(--bd);transition:border-color .2s,box-shadow .2s,background .2s}
#auth .af input:not([type=checkbox]):focus{border-color:var(--ac2)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)!important;outline:0}
#auth .af .pb{position:relative;overflow:hidden;height:48px;border-radius:14px!important;font-weight:700;background:linear-gradient(135deg,var(--ac),var(--ac2))!important;box-shadow:0 10px 30px color-mix(in srgb,var(--ac) 40%,transparent)!important;transition:transform .2s,filter .2s}
#auth .af .pb:hover{transform:translateY(-1px);filter:brightness(1.08)}
#auth .af .pb:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(-120%);animation:nxShim 3.4s ease-in-out infinite}
#auth .af .sb{border-radius:14px!important;transition:transform .2s,border-color .2s}
#auth .af .sb:hover{transform:translateY(-1px);border-color:var(--ac2)}
#auth .af .sm i{transition:background .3s,transform .3s}
#auth .sw a{cursor:pointer}

/* primera visita: pantalla de bienvenida */
#nxintro{position:fixed;inset:0;z-index:9100;display:grid;place-items:center;background:var(--bg);animation:nxOut .6s 1.9s forwards;pointer-events:none}
#nxintro div{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
#nxintro b{font:700 clamp(44px,9vw,96px)/1 var(--f);animation:nxIntro 1.5s cubic-bezier(.2,.8,.2,1) both;background:linear-gradient(100deg,var(--ac2),#fff,var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent}
#nxintro span{color:var(--mut);font:500 14px var(--m);letter-spacing:.12em;text-transform:uppercase;animation:nxIn 1s .7s both}

html.lite #auth .af:before,html.lite #auth .af .pb:after,html.lite #auth .grad,html.lite #auth .amq div{animation:none}
@media(prefers-reduced-motion:reduce){#auth .af:before,#auth .af .pb:after,#auth .grad,#auth .amq div,#auth .af>*{animation:none!important}#nxintro{display:none}}

@media(max-width:859px){
  #auth{grid-template-columns:1fr!important;grid-template-rows:auto 1fr;overflow:auto}
  #auth .aleft{display:flex!important;padding:calc(22px + env(safe-area-inset-top)) 22px 0!important;gap:12px;border:0!important}
  #auth .ahero{gap:10px}
  #auth .aleft h2{font-size:30px!important}
  #auth .asub,#auth .astats,#auth .feat,#auth .amq,#auth .acp{display:none}
  #auth .aright{padding:16px 16px calc(20px + env(safe-area-inset-bottom));place-items:start center}
  #auth .af{padding:22px 20px!important}
  #auth .aleft .brand{font-size:22px!important}
}
#auth .mbrand{display:none!important}
#auth .aleft .brand:before,#auth .brand:before{display:none!important;content:none!important}
#auth .feat{background:none!important;border:0!important;box-shadow:none!important;padding:0!important;border-radius:0!important}
#auth .feat:before,#auth .feat:after{display:none!important}
#auth .av{border-radius:50%!important}

/* ---------- zip (compresión STORE, sin dependencias) ---------- */
const CRC_TABLE = (() => {
 const t = new Uint32Array(256);
 for (let i = 0; i < 256; i++) { let c = i; for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); t[i] = c >>> 0 }
 return t;
})();
const crc32 = b => { let c = 0xFFFFFFFF; for (const x of b) c = CRC_TABLE[(c ^ x) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0 };
const u16 = v => [v & 255, (v >> 8) & 255];
const u32 = v => [v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >> 24) & 255];
function zip(files) {
 const E = new TextEncoder(), body = [], central = [];
 let offset = 0;
 for (const f of files) {
  const nameBytes = E.encode(f.n);
  const data = typeof f.d === 'string' ? E.encode(f.d) : f.d;
  const crc = crc32(data);
  const localHeader = new Uint8Array([
   ...u32(0x04034b50), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
   ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nameBytes.length), ...u16(0)
  ]);
  body.push(localHeader, nameBytes, data);
  const centralHeader = new Uint8Array([
   ...u32(0x02014b50), ...u16(20), ...u16(20), ...u16(0), ...u16(0), ...u16(0), ...u16(0),
   ...u32(crc), ...u32(data.length), ...u32(data.length), ...u16(nameBytes.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)
  ]);
  central.push(centralHeader, nameBytes);
  offset += localHeader.length + nameBytes.length + data.length;
 }
 const centralStart = offset;
 const centralLen = central.reduce((a, p) => a + p.length, 0);
 const end = new Uint8Array([
  ...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length),
  ...u32(centralLen), ...u32(centralStart), ...u16(0)
 ]);
 return new Blob([...body, ...central, end], { type: 'application/zip' });
}

/* ---------- empaquetado .py + README ---------- */
function readme(title, desc, example) {
 const lines = [
  'NOXY PLONT - ' + title,
  '='.repeat(46),
  '',
  'Que hace:',
  desc,
  '',
  'Uso rapido (Windows):',
  '1. Instala Python 3 desde python.org y marca "Add Python to PATH".',
  '2. Abre CMD en esta carpeta (shift + clic derecho > abrir terminal).',
  '3. pip install -r requirements.txt',
  '4. ' + example,
  '',
  'Linux / Mac:',
  '1. python3 -m pip install -r requirements.txt',
  '2. ' + example.replace('python ', 'python3 '),
  '',
  'Notas:',
  '- Solo usa datos publicos. Nada de esto rompe nada.',
  '- Si un servicio limita, espera un rato o cambia de red.',
  '- Hecho por Noxy.'
 ];
 return lines.join('\r\n') + '\r\n';
}
function pack(fileSlug, pyCode, title, desc, example) {
 return zip([
  { n: 'noxyplont_' + fileSlug + '.py', d: pyCode },
  { n: 'requirements.txt', d: 'requests\n' },
  { n: 'README.txt', d: readme(title, desc, example) }
 ]);
}

 function countHook(L) { ins += 20000; if (ins > 2e6) { lua.lua_pushstring(L, lua.to_luastring('bucle sin task.wait(): cortado')); lua.lua_error(L) } }

 function resume() {
  if (!co || !running) return;
  if (!el.isConnected) return;
  const L = co;
  curL = L;
  let base = 0;
  try { base = lua.lua_gettop(L); if (lua.lua_sethook && lua.LUA_MASKCOUNT) lua.lua_sethook(L, countHook, lua.LUA_MASKCOUNT, 20000); ins = 0 } catch (e) {}

   lua.lua_getglobal(L, lua.to_luastring('coroutine'));
   lua.lua_getfield(L, -1, lua.to_luastring('resume'));
   lua.lua_remove(L, -2);
   lua.lua_rawgeti(L, lua.LUA_REGISTRYINDEX, coRef);
   const okc = lua.lua_pcall(L, 1, lua.LUA_MULTRET, 0);
   try { if (lua.lua_sethook) lua.lua_sethook(L, null, 0, 0) } catch (e) {}

   if (!lua.lua_toboolean(L, base + 1)) { log(lua.lua_tojsstring(L, base + 2), 'e'); lua.lua_settop(L, base); return finish() }
   lua.lua_getglobal(L, lua.to_luastring('coroutine'));
   lua.lua_getfield(L, -1, lua.to_luastring('status'));
   lua.lua_remove(L, -2);
   lua.lua_rawgeti(L, lua.LUA_REGISTRYINDEX, coRef);
   let status = 'dead';
   if (lua.lua_pcall(L, 1, 1, 0) === lua.LUA_OK) { status = lua.lua_tojsstring(L, -1); lua.lua_pop(L, 1) }

<script>
/* ===== Noxy · Line Waves (WebGL con respaldo 2D) =====
   Fondo animado de líneas ondulantes. Lo usan la pantalla de login y el fondo "Line Waves".
   - Se adapta al color de acento del tema (--ac / --ac2).
   - Respeta modo ligero, pantallas táctiles y prefers-reduced-motion.
   - Se pausa solo cuando la pestaña está oculta o el canvas ya no está en el DOM. */
(()=>{
const VS='attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
const FS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R;uniform float T;uniform vec2 M;uniform vec3 C1;uniform vec3 C2;uniform vec3 C3;uniform float A;
void main(){
  float s=min(R.x,R.y);
  vec2 uv=(gl_FragCoord.xy-.5*R)/s;
  float a=-.42;
  mat2 rot=mat2(cos(a),-sin(a),sin(a),cos(a));
  vec2 q=rot*uv;
  vec2 m=rot*((M-.5*R)/s);
  vec3 col=vec3(0.);
  float reach=max(R.x,R.y)/s;
  float x=q.x;
  float dx=x-m.x;
  float mxw=.11*exp(-dx*dx*4.);
  float sx1=x*2.1,sx2=x*4.6,sx3=x*9.2;
  for(int i=0;i<34;i++){
    float f=float(i)/33.;
    float y0=(f-.5)*(1.55+reach*.55);
    if(abs(q.y-y0)>.34)continue;
    float y=y0
      +.105*sin(sx1+f*6.1+T*.33)
      +.055*sin(sx2-T*.46+f*9.3)
      +.028*sin(sx3+T*.71+f*3.7);
    float dy=y-m.y;
    y+=mxw*exp(-dy*dy*5.)*dy/sqrt(dy*dy+.012);
    float d=abs(q.y-y);
    float w=.0011+.0030*f;
    float line=smoothstep(w+.0017,w,d);
    float glow=exp(-d*46.)*.34;
    vec3 lc=mix(C1,C2,smoothstep(0.,.55,f));
    lc=mix(lc,C3,smoothstep(.55,1.,f));
    float bd=f-(fract(T*.035)*1.5-.25);
    float band=exp(-bd*bd*55.);
    float br=.46+.95*band;
    lc=mix(lc,vec3(1.),band*.38);
    col+=lc*(line*br+glow*br*.7);
  }
  col*=1.-.38*dot(uv,uv);
  col*=.78+.22*smoothstep(-.6,.6,uv.y);
  col*=A;
  float al=clamp(max(col.r,max(col.g,col.b)),0.,1.);
  gl_FragColor=vec4(min(col,vec3(al)),al);
}`;

const hex=c=>{c=(c||'').trim();let m=/^#?([0-9a-f]{6})$/i.exec(c);if(m){const n=parseInt(m[1],16);return[(n>>16)/255,(n>>8&255)/255,(n&255)/255]}
  m=/^#?([0-9a-f]{3})$/i.exec(c);if(m){const[a,b,d]=m[1];return[parseInt(a+a,16)/255,parseInt(b+b,16)/255,parseInt(d+d,16)/255]}
  m=/rgba?\(\s*(\d+)[ ,]+(\d+)[ ,]+(\d+)/i.exec(c);if(m)return[+m[1]/255,+m[2]/255,+m[3]/255];return[.78,.09,.11]};
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const palette=()=>{const cs=getComputedStyle(document.documentElement);
  const ac=hex(cs.getPropertyValue('--ac')),ac2=hex(cs.getPropertyValue('--ac2'));
  return[mix(ac,[0,0,0],.15),ac2,mix(ac2,[1,1,1],.55)]};

const lite=()=>document.documentElement.classList.contains('lite');
const coarse=()=>matchMedia('(pointer:coarse)').matches;
const still=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;

function makeGL(cv,fsrc){
  let gl;try{gl=cv.getContext('webgl',{alpha:true,antialias:false,premultipliedAlpha:true,powerPreference:'low-power',preserveDrawingBuffer:false})}catch(e){}
  if(!gl)return null;
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.warn('LineWaves shader:',gl.getShaderInfoLog(o));return null}return o};
  const v=sh(gl.VERTEX_SHADER,VS),f=sh(gl.FRAGMENT_SHADER,fsrc||FS);if(!v||!f)return null;
  const pr=gl.createProgram();gl.attachShader(pr,v);gl.attachShader(pr,f);gl.linkProgram(pr);
  if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return null;
  gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
  const loc=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pr,n);
  return{gl,u:{R:U('R'),T:U('T'),M:U('M'),C1:U('C1'),C2:U('C2'),C3:U('C3'),A:U('A')}};
}

/* respaldo sin WebGL: mismas líneas dibujadas en 2D */
function draw2d(cx,W,H,t,pal,mx,my){
  cx.clearRect(0,0,W,H);cx.save();cx.translate(W/2,H/2);cx.rotate(-.42);cx.lineWidth=1.1;
  const n=22,span=Math.hypot(W,H),col=i=>'rgb('+pal[i].map(v=>Math.round(v*255)).join(',')+')';
  for(let l=0;l<n;l++){const f=l/(n-1),by=(f-.5)*span*.9,band=Math.exp(-Math.pow(f-((t*.035)%1.5-.25),2)*55);
    cx.strokeStyle=col(f<.33?0:f<.7?1:2);cx.globalAlpha=.15+.7*band;cx.beginPath();
    for(let x=-span/2;x<=span/2;x+=14){const y=by+Math.sin(x*.006+f*6.1+t*.33)*span*.05+Math.sin(x*.013-t*.46+f*9.3)*span*.025;x>-span/2?cx.lineTo(x,y):cx.moveTo(x,y)}
    cx.stroke()}
  cx.restore()}

function create(cv,opts={}){
  const S={cv,alive:1,mx:-9,my:-9,tx:-9,ty:-9,t0:performance.now(),raf:0,last:0,pal:palette(),owner:opts.owner||null,onGone:opts.onGone};
  let G=makeGL(cv,opts.fs),c2=null;if(!G){c2=cv.getContext('2d')}
  S.gl=!!G;
  const scale=()=>lite()?.5:coarse()?.6:Math.min(devicePixelRatio||1,1.5)*.8;
  const size=()=>{const k=scale(),w=Math.max(2,Math.round(innerWidth*k)),h=Math.max(2,Math.round(innerHeight*k));if(cv.width!=w||cv.height!=h){cv.width=w;cv.height=h}
    if(G)G.gl.viewport(0,0,w,h)};
  const mv=e=>{const q=e.touches?e.touches[0]:e;if(!q)return;S.tx=q.clientX;S.ty=q.clientY};
  addEventListener('pointermove',mv,{passive:true});addEventListener('touchmove',mv,{passive:true});
  addEventListener('resize',size);size();
  const pal=()=>{S.pal=palette()};
  const mo=new MutationObserver(pal);mo.observe(document.documentElement,{attributes:true,attributeFilter:['data-t','style','class']});
  const lost=e=>{e.preventDefault()},restored=()=>{G=makeGL(cv,opts.fs);S.gl=!!G;size()};
  cv.addEventListener('webglcontextlost',lost);cv.addEventListener('webglcontextrestored',restored);
  const gone=()=>{S.alive=0;cancelAnimationFrame(S.raf);removeEventListener('pointermove',mv);removeEventListener('touchmove',mv);removeEventListener('resize',size);mo.disconnect();cv.remove();S.onGone&&S.onGone()};
  const frame=now=>{
    if(!S.alive)return;
    if(!cv.isConnected||(S.owner&&!S.owner.isConnected))return gone();
    S.raf=requestAnimationFrame(frame);
    if(document.hidden)return;
    const fi=lite()?1000/20:coarse()?1000/30:0;
    if(fi&&now-S.last<fi)return;S.last=now;
    const t=still()?7:(now-S.t0)/1000;
    const k=cv.width/innerWidth;
    S.mx+=(S.tx-S.mx)*.08;S.my+=(S.ty-S.my)*.08;
    if(G){const g=G.gl,u=G.u,p=S.pal;
      g.uniform2f(u.R,cv.width,cv.height);g.uniform1f(u.T,t);
      g.uniform2f(u.M,S.mx<-5?(opts.idle?-1e4:cv.width/2):S.mx*k,S.my<-5?(opts.idle?-1e4:cv.height/2):cv.height-S.my*k);
      g.uniform3fv(u.C1,p[0]);g.uniform3fv(u.C2,p[1]);g.uniform3fv(u.C3,p[2]);g.uniform1f(u.A,opts.alpha??1);
      g.clearColor(0,0,0,0);g.clear(g.COLOR_BUFFER_BIT);g.drawArrays(g.TRIANGLES,0,3)}
    else if(c2)(opts.d2||draw2d)(c2,cv.width,cv.height,t,S.pal,S.mx,S.my);
    if(still()&&S.raf){cancelAnimationFrame(S.raf);S.raf=0}
  };
  S.raf=requestAnimationFrame(frame);
  S.destroy=gone;
  return S}


/* Floating Lines: 3 capas de líneas flotantes con brillo, siguen el cursor y el color del tema */
const FLFS=`
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R;uniform float T;uniform vec2 M;uniform vec3 C1;uniform vec3 C2;uniform vec3 C3;uniform float A;
void main(){
  vec2 p=gl_FragCoord.xy/R.y;float asp=R.x/R.y;vec2 m=M/R.y;
  vec3 col=vec3(0.);
  for(int g=0;g<3;g++){
    float G=float(g);float gy=.2+G*.3;
    if(abs(p.y-gy)>.3)continue;
    vec3 gc=g==0?C1:(g==1?C2:C3);
    for(int i=0;i<8;i++){
      float f=float(i)/7.;
      float y0=gy+(f-.5)*.2;
      float fr=1.5+G*.8+f*.4;
      float ph=G*2.3+f*1.4;
      float sp=.32+G*.11;
      float x=p.x;
      float y=y0+(.05+.014*G)*sin(x*fr*2.1+T*sp+ph)+.022*sin(x*fr*4.3-T*sp*1.3+ph*1.7);
      float dx=x-m.x,dm=m.y-y;
      y+=dm*exp(-dx*dx*7.)*exp(-dm*dm*14.)*.5;
      float d=abs(p.y-y);
      float w=.0012+.0016*f;
      float core=smoothstep(w+.0016,w,d);
      float glow=exp(-d*60.)*.22;
      vec3 lc=mix(gc,C3,f*.5);
      col+=lc*(core*(.55+.5*f)+glow*(.4+.6*f));
    }
  }
  float vg=length(p-vec2(asp*.5,.5))/(asp*.6);
  col*=1.-.32*vg*vg;
  col*=A;
  float al=clamp(max(col.r,max(col.g,col.b)),0.,1.);
  gl_FragColor=vec4(min(col,vec3(al)),al);
}`;
function flines2d(cx,W,H,t,pal,mx,my){cx.clearRect(0,0,W,H);cx.lineWidth=1.3;const col=i=>'rgb('+pal[i].map(v=>Math.round(v*255)).join(',')+')';
  for(let g=0;g<3;g++)for(let i=0;i<8;i++){const f=i/7,y0=H*(1-(.2+g*.3+(f-.5)*.2)),fr=1.5+g*.8+f*.4,ph=g*2.3+f*1.4,sp=.32+g*.11;cx.strokeStyle=col(g);cx.globalAlpha=.35+.4*f;cx.beginPath();
    for(let x=0;x<=W+8;x+=8){const u=x/H;let y=y0-H*((.05+.014*g)*Math.sin(u*fr*2.1+t*sp+ph)+.022*Math.sin(u*fr*4.3-t*sp*1.3+ph*1.7));
      if(mx>-5){const dx=(x-mx)/H,dy=(my-y)/H;y+=dy*H*Math.exp(-dx*dx*7)*Math.exp(-dy*dy*14)*.5}x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}cx.globalAlpha=1}

const mkCanvas=(id,z)=>{const c=document.createElement('canvas');c.id=id;
  c.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:'+z+';pointer-events:none;display:block;background:none;border:0;margin:0;max-width:none;border-radius:0';return c};

let bgInst=null;
const NXLW={
  /* pantalla de login: lienzo debajo de #auth, se destruye solo cuando #auth desaparece */
  login(auth){
    try{if(!auth)return;const old=document.getElementById('nxlw-login');if(old){if(old._owner===auth)return;old.remove()}
      const look=(()=>{try{return JSON.parse(localStorage.getItem('look'))||{}}catch(e){return{}}})();
      if(look.lw===0)return;
      const cv=mkCanvas('nxlw-login',8999);cv._owner=auth;auth.classList.add('lw');auth.before(cv);
      create(cv,{owner:auth,alpha:1,fs:FLFS,d2:flines2d,idle:1,onGone:()=>auth.classList.remove('lw')});
    }catch(e){console.warn('LineWaves login:',e)}},
  /* fondo global (modo "Line Waves" del personalizador). Devuelve true si lo pinta con WebGL */
  bg(on){
    if(bgInst){bgInst.destroy();bgInst=null}
    if(!on)return false;
    const cv=mkCanvas('nxlw-bg',0);document.body.prepend(cv);
    bgInst=create(cv,{alpha:.9,onGone:()=>{bgInst=null}});
    return true},
  create};
window.NXLW=NXLW;

/* si ya estaban listos antes de cargar este archivo */
const boot=()=>{const a=document.getElementById('auth');if(a)NXLW.login(a);
  if(typeof NXL!=='undefined'&&NXL.refresh)NXL.refresh()};
boot();
})();

</script>
<script>

<script>
/* ===== Noxy · mejoras de la pantalla de inicio de sesión / registro ===== */

<script>
/* ===== Noxy · Terminal v2 =====
   Dos mundos en una sola terminal:
   1) "Noxy shell": intérprete propio en el navegador (pipes, redirecciones, &&, ;, variables, comandos,
      sudo/apt con paquetes integrados, Python real con Pyodide, Node/npm, git, curl...).
   2) Perfiles NATIVOS (solo app de Windows / Android): ejecutan comandos reales del sistema
      (PowerShell, CMD, WSL con `sudo apt install` de verdad, bash en Linux/Mac, sh en Android). */
(()=>{
'use strict';
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------- ANSI → HTML ---------- */
const C16=['#2b303b','#ff5c57','#5af78e','#f3f99d','#57c7ff','#ff6ac1','#9aedfe','#e6e6e6','#686868','#ff8480','#8cffb0','#fffcb4','#8fd8ff','#ff9ad6','#c0f4ff','#ffffff'];
const c256=n=>{if(n<16)return C16[n];if(n>=232){const v=8+(n-232)*10;return`rgb(${v},${v},${v})`}n-=16;const r=n/36|0,g=(n/6|0)%6,b=n%6,f=v=>v?55+v*40:0;return`rgb(${f(r)},${f(g)},${f(b)})`};

  const flush=()=>{if(!buf)return;const css=[];if(st.fg)css.push('color:'+st.fg);if(st.bg)css.push('background:'+st.bg);
    const cl=(st.b?'b ':'')+(st.d?'dim ':'')+(st.u?'ul':'');
    out+=(css.length||cl)?`<span class="${cl}" style="${css.join(';')}">${E(buf)}</span>`:E(buf);buf=''};
  const sgr=p=>{const a=p===''?[0]:p.split(';').map(Number);
    for(let i=0;i<a.length;i++){const c=a[i];
      if(c===0)st={b:0,d:0,u:0,fg:null,bg:null};else if(c===1)st.b=1;else if(c===2)st.d=1;else if(c===4)st.u=1;else if(c===22){st.b=0;st.d=0}else if(c===24)st.u=0;
      else if(c>=30&&c<=37)st.fg=C16[c-30];else if(c>=90&&c<=97)st.fg=C16[c-90+8];else if(c===39)st.fg=null;
      else if(c>=40&&c<=47)st.bg=C16[c-40];else if(c>=100&&c<=107)st.bg=C16[c-100+8];else if(c===49)st.bg=null;
      else if((c===38||c===48)&&a[i+1]===5){const v=c256(a[i+2]|0);c===38?st.fg=v:st.bg=v;i+=2}
      else if((c===38||c===48)&&a[i+1]===2){const v=`rgb(${a[i+2]|0},${a[i+3]|0},${a[i+4]|0})`;c===38?st.fg=v:st.bg=v;i+=4}}};
  const re=/\x1b\[([0-9;]*)m|\x1b\[[0-9;?]*[A-Za-ln-z]|\x1b\][^\x07]*\x07/g;let i=0,m;
  while((m=re.exec(s))){buf+=s.slice(i,m.index);i=re.lastIndex;if(m[1]===undefined)continue;flush();sgr(m[1])}

const col={r:t=>`\x1b[31m${t}\x1b[0m`,g:t=>`\x1b[32m${t}\x1b[0m`,y:t=>`\x1b[33m${t}\x1b[0m`,b:t=>`\x1b[1;34m${t}\x1b[0m`,c:t=>`\x1b[36m${t}\x1b[0m`,d:t=>`\x1b[2m${t}\x1b[0m`,B:t=>`\x1b[1m${t}\x1b[0m`};

/* ---------- Intérprete Noxy (navegador) ---------- */
function makeShell(host){
  const user=host.user,home='/home/'+user,K='fs_'+user;
  let fs=LS.g(K,null)||{};
  ['/','/home',home,'/tmp','/etc'].forEach(d=>{if(!(d in fs))fs[d]=null});
  const save=()=>LS.s(K,fs);
  let cwd=home,oldcwd=home,last=0;
  const env={HOME:home,USER:user,LOGNAME:user,SHELL:'/bin/noxysh',PATH:'/usr/local/bin:/usr/bin:/bin',LANG:'es_ES.UTF-8',TERM:'xterm-256color',HOSTNAME:'noxy',...LS.g('tv_'+user,{})};
  const alias=LS.g('ta_'+user,{ll:'ls -l',la:'ls -a',l:'ls -CF','..':'cd ..'});
  const hist=LS.g('th_'+user,[]);
  const procs=[];

  /* --- sistema de archivos virtual --- */
  const norm=p=>{p=(p||'').replace(/^~(?=\/|$)/,home);const r=[];(p[0]=='/'?p:cwd+'/'+p).split('/').forEach(s=>{if(s=='..')r.pop();else if(s&&s!='.')r.push(s)});return'/'+r.join('/')};
  const kids=x=>Object.keys(fs).filter(k=>k!=x&&k.startsWith(x=='/'?'/':x+'/'));
  const direct=x=>kids(x).filter(k=>!k.slice(x=='/'?1:x.length+1).includes('/'));
  const isDir=x=>x in fs&&fs[x]===null||!!VIRT[x]&&VIRT[x].dir;
  const isFile=x=>typeof fs[x]=='string'||(!!VIRT[x]&&!VIRT[x].dir);
  const exists=x=>x in fs||!!VIRT[x];
  const mk=x=>{let p='';x.split('/').filter(Boolean).forEach(s=>{p+='/'+s;if(!(p in fs))fs[p]=null})};
  const put=(x,t)=>{mk(x.split('/').slice(0,-1).join('/'));fs[x]=t};
  const VIRT={
    '/dev/null':{get:()=>''},
    '/etc/os-release':{get:()=>'PRETTY_NAME="Noxy OS 3 (shell del navegador)"\nNAME="Noxy OS"\nVERSION_ID="3"\nID=noxy\nID_LIKE=debian\n'},
    '/etc/hostname':{get:()=>'noxy\n'},
    '/proc/cpuinfo':{get:()=>Array.from({length:navigator.hardwareConcurrency||2},(_,i)=>`processor\t: ${i}\nmodel name\t: ${navigator.platform||'cpu'} (reportado por el navegador)\n`).join('\n')},
    '/proc/meminfo':{get:()=>`MemTotal:       ${Math.round((navigator.deviceMemory||4)*1048576)} kB\n`},
    '/etc':{dir:1},'/dev':{dir:1},'/proc':{dir:1}
  };
  const readf=x=>VIRT[x]&&VIRT[x].get?VIRT[x].get():fs[x];
  Object.keys(VIRT).forEach(k=>{if(VIRT[k].dir&&!(k in fs)&&k!='/etc')fs[k]=null});

  /* --- paquetes --- */
  const base=['bash','coreutils','grep','sed','gawk','findutils','curl','wget','git','nano','zip','unzip','iputils-ping','dnsutils','net-tools','tree','sudo','apt'];
  let inst=new Set(LS.g('apt_'+user,base));base.forEach(b=>inst.add(b));
  const saveInst=()=>LS.s('apt_'+user,[...inst]);

  /* --- lexer / parser --- */
  async function expandVar(s,i,io){ // s[i]=='$'
    const n=s[i+1];
    if(n=='?')return{v:String(last),i:i+2};
    if(n=='$')return{v:'1',i:i+2};
    if(n=='('){let d=1,j=i+2;while(j<s.length&&d){if(s[j]=='(')d++;else if(s[j]==')')d--;j++}
      const inner=s.slice(i+2,j-1);let buf='';await runLine(inner,{out:t=>{buf+=t},err:io.err,in:null,sub:1});return{v:buf.replace(/\n+$/,''),i:j}}
    if(n=='{'){const j=s.indexOf('}',i);const k=s.slice(i+2,j);return{v:env[k]??'',i:j+1}}
    const m=/^[A-Za-z_]\w*/.exec(s.slice(i+1));
    if(m)return{v:env[m[0]]??'',i:i+1+m[0].length};
    return{v:'$',i:i+1}}
  async function lex(s,io){
    const toks=[];let cur='',has=false,glob=false,i=0;
    const push=()=>{if(has){toks.push({w:cur,g:glob});}cur='';has=false;glob=false};
    while(i<s.length){const c=s[i];
      if(c=="'"){let j=s.indexOf("'",i+1);if(j<0)j=s.length;cur+=s.slice(i+1,j);has=true;i=j+1;continue}
      if(c=='"'){i++;while(i<s.length&&s[i]!='"'){if(s[i]=='\\'&&'"\\$`'.includes(s[i+1])){cur+=s[i+1];i+=2}else if(s[i]=='$'){const r=await expandVar(s,i,io);cur+=r.v;i=r.i}else cur+=s[i++]}i++;has=true;continue}
      if(c=='\\'){cur+=s[i+1]??'';i+=2;has=true;continue}
      if(c=='$'){const r=await expandVar(s,i,io);cur+=r.v;i=r.i;has=true;continue}
      if(c=='~'&&!has&&(i+1>=s.length||/[\s\/]/.test(s[i+1]))){cur+=home;has=true;i++;continue}
      if(/\s/.test(c)){push();i++;continue}
      if(c=='#'&&!has)break;
      if(c=='2'&&!has&&s.startsWith('2>&1',i)){toks.push({op:'2>&1'});i+=4;continue}
      if(c=='2'&&!has&&s[i+1]=='>'){toks.push({op:s[i+2]=='>'?'2>>':'2>'});i+=s[i+2]=='>'?3:2;continue}
      if(c=='&'&&s[i+1]=='>'){push();toks.push({op:'&>'});i+=2;continue}
      if('|&;<>'.includes(c)){push();const t2=s.substr(i,2);if(t2=='||'||t2=='&&'||t2=='>>'){toks.push({op:t2});i+=2}else{toks.push({op:c});i++}continue}
      if(c=='*'||c=='?')glob=true;
      cur+=c;has=true;i++}
    push();return toks}
  const globRe=g=>new RegExp('^'+g.replace(/[.+^${}()|[\]\\]/g,'\\$&').replace(/\*/g,'[^/]*').replace(/\?/g,'[^/]')+'$');
  function expandGlob(t){
    if(!t.g)return[t.w];
    const full=t.w.startsWith('/'),parts=t.w.split('/'),pat=parts.pop(),dir=parts.join('/')||(full?'/':'.');
    const d=norm(dir),re=globRe(pat);
    const res=direct(d).map(k=>k.split('/').pop()).filter(n=>re.test(n)&&(pat[0]=='.'||n[0]!='.')).sort().map(n=>(dir=='.'?'':(dir=='/'?'/':dir+'/'))+n);
    return res.length?res:[t.w]}

  /* --- ejecución --- */
  const argp=(a,withVal='')=>{const f=new Set(),v={},r=[];for(let i=0;i<a.length;i++){const x=a[i];
    if(x=='--'){r.push(...a.slice(i+1));break}
    if(/^-[A-Za-z]/.test(x)&&x.length>1&&!/^-\d+$/.test(x)){for(let j=1;j<x.length;j++){const ch=x[j];if(withVal.includes(ch)){v[ch]=x.length>j+1?x.slice(j+1):a[++i];break}f.add(ch)}}
    else if(x.startsWith('--')){f.add(x.slice(2))}else r.push(x)}
    return{f,v,r}};
  const needInput=async(files,io,cmd)=>{ // devuelve [{n,t}] desde archivos o stdin
    if(!files.length||(files.length==1&&files[0]=='-')){if(io.in==null)return null;return[{n:'-',t:io.in}]}
    const o=[];for(const f of files){const p=norm(f);if(!exists(p)){io.err(`${cmd}: ${f}: No existe el archivo o directorio\n`);continue}if(isDir(p)){io.err(`${cmd}: ${f}: Es un directorio\n`);continue}o.push({n:f,t:readf(p)??''})}
    return o};
  const cmds={};
  const run1=async(args,io)=>{
    let name=args[0];
    if(!name)return 0;
    if(alias[name]&&!io.noalias){const ex=await lex(alias[name],io);args=[...ex.map(t=>t.w),...args.slice(1)];name=args[0]}
    const f=cmds[name];
    if(!f){
      if(/^[.\/]/.test(name)&&isFile(norm(name))){return cmds.sh(args,io)}
      const pk=pkgFor(name);
      io.err(`${name}: command not found\n`);
      if(pk)io.err(col.y(`El comando '${name}' está en el paquete '${pk}'. Instálalo con: sudo apt install ${pk}\n`));
      return 127}
    if(f.pkg&&!inst.has(f.pkg)){io.err(`${name}: command not found\n`);io.err(col.y(`El comando '${name}' está en el paquete '${f.pkg}'. Instálalo con: sudo apt install ${f.pkg}\n`));return 127}
    try{const r=await f(args.slice(1),io);return typeof r=='number'?r:0}
    catch(e){io.err(`${name}: ${e&&e.message||e}\n`);return 1}};

  async function runPipeline(toks,io){
    // separar en etapas por '|'
    const stages=[[]];toks.forEach(t=>{if(t.op=='|')stages.push([]);else stages[stages.length-1].push(t)});
    let input=io.in??null,code=0;
    for(let si=0;si<stages.length;si++){
      const st=stages[si],args=[],red={};let assign=true;const envLocal={};
      for(let i=0;i<st.length;i++){const t=st[i];
        if(t.op){const nx=st[i+1];
          if(['>','>>','<','2>','2>>','&>'].includes(t.op)){if(!nx||nx.op){io.err('error de sintaxis cerca de '+t.op+'\n');return 2}red[t.op]=nx.w;i++}
          else if(t.op=='2>&1')red.e2o=1;
          continue}
        if(assign&&!args.length&&/^[A-Za-z_]\w*=/.test(t.w)&&!t.g){const k=t.w.indexOf('=');envLocal[t.w.slice(0,k)]=t.w.slice(k+1);continue}
        assign=false;args.push(...expandGlob(t))}
      if(!args.length){Object.assign(env,envLocal);host.persistEnv&&host.persistEnv(env);continue}
      let stdin=input;if(red['<']){const p=norm(red['<']);if(!isFile(p)){io.err(`${red['<']}: No existe el archivo o directorio\n`);return 1}stdin=readf(p)}
      let buf='',errbuf='';const last2=si==stages.length-1;
      const so=red['>']||red['>>']||red['&>']?null:(last2?null:'pipe');
      const outFn=t=>{if(so=='pipe'||red['>']||red['>>']||red['&>'])buf+=t;else io.out(t)};
      const errFn=t=>{if(red['2>']||red['2>>']||red['&>']){if(red['2>']&&red['2>']=='/dev/null'||red['&>']=='/dev/null'){}else errbuf+=t}else if(red.e2o)outFn(t);else io.err(t)};
      const old={};for(const k in envLocal){old[k]=env[k];env[k]=envLocal[k]}
      code=await run1(args,{out:outFn,err:errFn,in:stdin,noalias:io.noalias,sub:io.sub});
      for(const k in envLocal){if(old[k]===undefined)delete env[k];else env[k]=old[k]}
      const wr=(path,txt,app)=>{const p=norm(path);if(p=='/dev/null')return;if(isDir(p)){io.err(`${path}: Es un directorio\n`);return}put(p,(app&&typeof fs[p]=='string'?fs[p]:'')+txt);save()};
      if(red['>'])wr(red['>'],buf,0);else if(red['>>'])wr(red['>>'],buf,1);else if(red['&>'])wr(red['&>'],buf+errbuf,0);
      if(red['2>']&&red['2>']!='/dev/null')wr(red['2>'],errbuf,0);if(red['2>>'])wr(red['2>>'],errbuf,1);

    return code}
  function splitSeq(s){const out=[];let cur='',j=';',i=0,q=null,d=0;
    const push=(nj)=>{out.push({s:cur,j});cur='';j=nj};
    while(i<s.length){const c=s[i];
      if(q){cur+=c;if(c=='\\'&&q=='"'){cur+=s[i+1]??'';i+=2;continue}if(c==q)q=null;i++;continue}
      if(c=="'"||c=='"'){q=c;cur+=c;i++;continue}
      if(c=='\\'){cur+=c+(s[i+1]??'');i+=2;continue}
      if(c=='$'&&s[i+1]=='('){d++;cur+='$(';i+=2;continue}
      if(d&&c==')'){d--;cur+=c;i++;continue}
      if(!d){
        if(c==';'){push(';');i++;continue}
        if(c=='&'&&s[i+1]=='&'){push('&&');i+=2;continue}
        if(c=='|'&&s[i+1]=='|'){push('||');i+=2;continue}
        if(c=='&'&&s[i+1]!='>'&&s[i-1]!='>'&&s[i-1]!='&'){push(';');i++;continue}}
      cur+=c;i++}
    out.push({s:cur,j});return out}
  async function runLine(line,io){
    line=line.trim();if(!line)return last;
    let code=last;
    for(const seg of splitSeq(line)){
      if(seg.j=='&&'&&code!==0)continue;if(seg.j=='||'&&code===0)continue;
      const toks=await lex(seg.s,io);if(!toks.length)continue;
      code=await runPipeline(toks,io);last=code}
    return code}
  const prompt=()=>`\x1b[1;32m${user}@noxy\x1b[0m:\x1b[1;34m${cwd==home?'~':cwd.startsWith(home+'/')?'~'+cwd.slice(home.length):cwd}\x1b[0m$ `;

  /* --- paquetes: registro --- */
  const REG={};const PKGFOR={};
  const addPkg=(n,d,provides,extra={})=>{REG[n]={n,d,provides,v:extra.v||'noxy-1',real:!!extra.real,inst:extra.inst,alias:extra.alias};provides.forEach(p=>PKGFOR[p]=PKGFOR[p]||n)};
  const pkgFor=c=>PKGFOR[c];
  const sh={fs,env,alias,hist,home,K,
    get cwd(){return cwd},set cwd(v){oldcwd=cwd;cwd=v},get oldcwd(){return oldcwd},
    norm,kids,direct,isDir,isFile,exists,mk,put,readf,save,cmds,argp,needInput,runLine,prompt,col,ansi,
    REG,addPkg,pkgFor,inst,saveInst,base,host,procs,
    get last(){return last}};
  sh.run=(line,io)=>runLine(line,{in:null,...io});
  (window.__NT.sets||[]).forEach(f=>{try{f(sh)}catch(e){console.warn('terminal set',e)}});
  sh.complete=(line)=>{
    const m=/(\S*)$/.exec(line),w=m[1],first=!/\s/.test(line.trim())&&!/\s$/.test(line);
    if(first){const names=[...new Set([...Object.keys(cmds),...Object.keys(alias)])].filter(n=>n.startsWith(w)&&(!cmds[n]||!cmds[n].pkg||inst.has(cmds[n].pkg))).sort();return{w,list:names}}
    const slash=w.lastIndexOf('/'),dirp=slash>=0?w.slice(0,slash+1):'',part=w.slice(slash+1),d=norm(dirp||'.');
    if(!isDir(d))return{w:part,list:[]};
    const L=direct(d).map(k=>k.split('/').pop()).filter(n=>n.startsWith(part)&&(part||n[0]!='.')).map(n=>dirp+n+(isDir(norm(dirp+n))?'/':'')).sort();
    return{w,list:L}};
  return sh}
window.__NT={makeShell,ansi,col,E,sleep,sets:[]};
})();

<script>
/* ===== Noxy Terminal · comandos de archivos y texto ===== */
(()=>{
'use strict';
const {col,sleep}=window.__NT;
window.__NT.sets.push(sh=>{
const {cmds,fs,env,alias,hist,home,norm,kids,direct,isDir,isFile,exists,mk,put,readf,save,argp,needInput}=sh;
const D=(n,f,pkg)=>{if(pkg)f.pkg=pkg;cmds[n]=f};
const ln=s=>s.endsWith('\n')?s:s+'\n';
const lines=t=>{const a=t.split('\n');if(a[a.length-1]==='')a.pop();return a};
const size=x=>isFile(x)?(readf(x)||'').length:4096;
const human=n=>n<1024?n+'B':n<1048576?(n/1024).toFixed(1)+'K':(n/1048576).toFixed(1)+'M';

D('echo',(a,io)=>{let nl=true,esc=false;while(a[0]&&/^-[neE]+$/.test(a[0])){if(a[0].includes('n'))nl=false;if(a[0].includes('e'))esc=true;a.shift()}
  let t=a.join(' ');if(esc)t=t.replace(/\\n/g,'\n').replace(/\\t/g,'\t').replace(/\\e/g,'\x1b').replace(/\\033/g,'\x1b').replace(/\\\\/g,'\\');io.out(t+(nl?'\n':''))});

<script>

(()=>{

    exec:o=>P.exec(o),write:(id,d)=>P.write({id,data:d}),kill:id=>P.kill({id}),
    onData:cb=>{let h;const p=P.addListener('data',e=>cb(e.id,e.stream,e.chunk));Promise.resolve(p).then(x=>h=x);return()=>h&&h.remove()},
    cwd:async()=>(await P.info()).home};

function term2(el){

  el.innerHTML=`<div class=nterm><div class=nt-bar><select class=nt-prof title="Dónde se ejecutan los comandos"></select><button class=nt-clr>Limpiar</button><button class=nt-help>Ayuda</button><span class=nt-st></span></div><div class=nt-out></div><div class=nt-row><span class=nt-ps></span><input class=nt-in autocomplete=off autocapitalize=none autocorrect=off spellcheck=false enterkeyhint=send></div><div class=nt-keys><button data-k=Tab>Tab</button><button data-k=Ctrl-C>Ctrl+C</button><button data-k=Up>↑</button><button data-k=Down>↓</button><button data-k=Ctrl-L>Ctrl+L</button><button data-k=/>/</button><button data-k=->-</button><button data-k=|>|</button><button data-k=~>~</button></div></div>`;
  const $q=s=>el.querySelector(s),O=$q('.nt-out'),IN=$q('.nt-in'),PS=$q('.nt-ps'),SEL=$q('.nt-prof'),ST=$q('.nt-st');
  const nat=nativeAdapter();
  let shell=makeShell({user,persistEnv:e=>LS.s('tv_'+user,e)});
  const hist=shell.hist;let hi=hist.length,mode='noxy',ncwd='',running=null,aborted=false,secret=false,curEl=null,curRaw='',nLines=0;
  const scroll=()=>{O.scrollTop=O.scrollHeight};
  const nearBottom=()=>O.scrollHeight-O.scrollTop-O.clientHeight<80;
  const newLine=()=>{curEl=document.createElement('span');curEl.className='nt-ln';O.appendChild(curEl);curRaw='';if(++nLines>3000){for(let i=0;i<500&&O.firstChild;i++){O.removeChild(O.firstChild);nLines--}}};

    parts.forEach((seg,i)=>{if(seg.includes('\x1bc')){O.innerHTML='';nLines=0;newLine();seg=seg.split('\x1bc').pop()}

  const status=t=>{ST.textContent=t||''};

  /* perfiles */

    const last=LS.g('nt_prof_'+nat.kind,'');if(last&&L.some(p=>p.id==last)){SEL.value=last;sel()}}).catch(()=>{});
    offData=nat.onData((id,stream,chunk)=>{if(!el.isConnected){offData&&offData();return}if(running==='native'&&id===curId){write(chunk);if(/\[sudo\]|password for|contrase[ñn]a|Password:/i.test(chunk.slice(-80)))secret=true,IN.type='password'}})}
  let curId='';
  const sel=async()=>{mode=SEL.value;if(nat)LS.s('nt_prof_'+nat.kind,mode);
    if(mode=='noxy'){status('');write(col.d('— Noxy shell —\n'))}
    else{try{ncwd=await nat.cwd()}catch(e){ncwd=''}
      const p=SEL.selectedOptions[0];status('REAL · '+(nat.kind=='electron'?'ejecuta en tu PC':'ejecuta en el teléfono'));
      write(col.y(`Perfil real: ${p.textContent.replace(' · real','')}. Los comandos se ejecutan de verdad en tu dispositivo.\n`)+(/wsl|bash|zsh|sh/.test(mode)?col.d('Para sudo/apt escribe tu contraseña cuando la pida. Usa  -y  para confirmar sin preguntar (ej: sudo apt install -y jq).\n'):'')+(p.title?col.d(p.title+'\n'):''))}
    setPrompt()};
  SEL.onchange=sel;

  /* ejecución */
  const runNoxy=async line=>{running='noxy';aborted=false;IN.disabled=true;
    try{await shell.run(line,{out:t=>write(t),err:t=>write(t)})}catch(e){write(col.r(String(e&&e.message||e))+'\n')}
    running=null;IN.disabled=false;IN.focus()};
  const runNative=async line=>{running='native';curId='c'+Date.now()+Math.random().toString(36).slice(2,7);secret=false;
    try{const r=await nat.exec({id:curId,profile:mode,cmd:line,cwd:ncwd});if(r&&r.cwd)ncwd=r.cwd;if(r&&r.error)write(col.r(r.error)+'\n')}

  const submit=async()=>{const line=IN.value;IN.value='';
    if(running==='native'){write((secret?'':line)+'\n');secret=false;IN.type='text';nat.write(curId,line+'\n');return}
    if(running)return;
    write((mode=='noxy'?shell.prompt():PS.textContent)+line+'\n');
    const t=line.trim();if(!t){setPrompt();return}
    if(hist[hist.length-1]!==t){hist.push(t);LS.s('th_'+user,hist.slice(-200))}hi=hist.length;
    if(mode=='noxy')await runNoxy(line);else await runNative(line);
    flushNow();setPrompt();scroll()};
  const ctrlC=()=>{if(running==='native'){nat.kill(curId);write('^C\n')}else if(running){aborted=true;write('^C\n');running=null;IN.disabled=false;IN.focus()}else{write('^C\n');IN.value=''}setPrompt()};
  const complete=()=>{if(mode!='noxy'||running)return;const{w,list}=shell.complete(IN.value);if(!list.length)return;
    if(list.length==1){IN.value=IN.value.slice(0,IN.value.length-w.length)+list[0]+(list[0].endsWith('/')?'':' ')}
    else{let p=list[0];list.forEach(x=>{while(!x.startsWith(p))p=p.slice(0,-1)});if(p.length>w.length)IN.value=IN.value.slice(0,IN.value.length-w.length)+p;else write(ansi(shell.prompt())+IN.value+'\n'+list.join('  ')+'\n')}};
  const key=k=>{if(k=='Tab')complete();else if(k=='Ctrl-C')ctrlC();else if(k=='Ctrl-L'){O.innerHTML='';nLines=0;newLine()}else if(k=='Up'){if(hi>0)IN.value=hist[--hi]||''}else if(k=='Down'){hi=Math.min(hist.length,hi+1);IN.value=hist[hi]||''}else{IN.value+=k}IN.focus()};
  IN.onkeydown=e=>{
    if(e.key=='Enter'){e.preventDefault();submit()}

    else if(e.key=='ArrowUp'){e.preventDefault();key('Up')}
    else if(e.key=='ArrowDown'){e.preventDefault();key('Down')}

    else if(e.ctrlKey&&e.key.toLowerCase()=='u'){e.preventDefault();IN.value=''}};
  $q('.nt-keys').onclick=e=>{const b=e.target.closest('[data-k]');if(b)key(b.dataset.k)};

  setPrompt();flushNow();setTimeout(()=>IN.focus(),60)}

window.__NT.term2=term2;
const install=()=>{if(typeof APPS=='undefined')return false;const a=APPS.find(x=>x.id=='term');if(!a)return false;a.r=term2;a.desc='Terminal con sudo/apt, pipes, Python y Node reales; en la app de escritorio ejecuta comandos de verdad.';a.tech=['Noxy shell','WebAssembly','Shell nativo'];return true};

})();

T7('aicve','Explicador de CVE','shield','Busca un CVE en la base del NIST y te lo explica en lenguaje claro.','Seguridad','<input id=i placeholder="CVE-2024-3094" autocapitalize=none spellcheck=false><div class=acts style="margin:10px 0"><button class=pb id=b>Buscar y explicar</button></div><div id=o></div>',el=>{

  q('#b',el).onclick=async()=>{const v=q('#i',el).value.trim(),o=q('#o',el);if(!v)return;o.innerHTML='<p class=sub>Pensando...</p>';

  q('#d',el).onclick=()=>{if(!svg)return;const ac=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()||'#c8161d';const fg='#222';dl(new Blob([svg.replace(/var\(--ac\)/g,ac).replace(/currentColor/g,fg).replace('<svg ','<svg style="background:#fff" ')],{type:'image/svg+xml'}),'mapa-mental.svg')}},['IA','SVG']);

T7('ioc','Extractor de IOCs','shield','Saca IPs, dominios, URLs, hashes, correos y CVE de cualquier texto o reporte.','Seguridad',TA('i','Pega un reporte, log o correo...',8)+'<div class=acts style="margin:10px 0"><button class=pb id=b>Extraer</button><label class=ck style="display:inline-flex;gap:6px;align-items:center"><input type=checkbox id=f checked><span>Neutralizar (hxxp, [.])</span></label></div><div id=o></div>',el=>{

const puny=(function(){const b=36,tMin=1,tMax=26,skew=38,damp=700;const ad=(d,n,f)=>{let k=0;d=f?Math.floor(d/damp):d>>1;d+=Math.floor(d/n);for(;d>((b-tMin)*tMax)>>1;k+=b)d=Math.floor(d/(b-tMin));return Math.floor(k+(b-tMin+1)*d/(d+skew))};
  return s=>{if(!/^xn--/i.test(s))return s;s=s.slice(4);const o=[];let i=0,n=128,bias=72;let bs=s.lastIndexOf('-');if(bs<0)bs=0;for(let j=0;j<bs;j++)o.push(s.charCodeAt(j));
    for(let ix=bs>0?bs+1:0;ix<s.length;){const oi=i;for(let w=1,k=b;;k+=b){const c=s.charCodeAt(ix++),dg=c-48<10?c-22:c-65<26?c-65:c-97<26?c-97:b;i+=dg*w;const t=k<=bias?tMin:k>=bias+tMax?tMax:k-bias;if(dg<t)break;w*=b-t}
      const L=o.length+1;bias=ad(i-oi,L,oi==0);n+=Math.floor(i/L);i%=L;o.splice(i++,0,n)}return String.fromCodePoint(...o)}})();
T7('urlx','Inspector de URL','shield','Analiza un enlace sin abrirlo: trucos de suplantación, homógrafos, redirecciones y riesgo.','Seguridad','<input id=i placeholder="https://paypa1-login.secure-verify.top/cuenta?next=http://otro.com" spellcheck=false autocapitalize=none><div class=acts style="margin:10px 0"><button class=pb id=b>Analizar</button></div><div id=o></div>',el=>{

    if(/^\d+$/.test(host)||/^0x[0-9a-f]+$/i.test(host)||/^(\d{1,3}\.){3}\d{1,3}$/.test(host)||host.startsWith('['))add('bad','El destino es una dirección IP, no un dominio',30);

  const V={AV:{N:.85,A:.62,L:.55,P:.2},AC:{L:.77,H:.44},UI:{N:.85,R:.62},C:{H:.56,L:.22,N:0},I:{H:.56,L:.22,N:0},A:{H:.56,L:.22,N:0}};

<script type="text/plain" id="nx-runner-src">#!/usr/bin/env node
/* Noxy Runner 1.0 — ejecuta bots (Python / Node.js) de forma persistente.
   Sin dependencias. Requiere Node 18+ (y Python 3 si vas a correr bots de Python).
   Variables: PORT (8787) · RUNNER_TOKEN · ALLOW_ORIGIN (https://tu-app.vercel.app, separados por coma) · DATA_DIR */
'use strict';
const http = require('http'), fs = require('fs'), path = require('path'), cp = require('child_process'), crypto = require('crypto'), os = require('os');
const PORT = +process.env.PORT || 8787;
const DATA = path.resolve(process.env.DATA_DIR || path.join(__dirname, 'data'));
const ORIGINS = (process.env.ALLOW_ORIGIN || '*').split(',').map(s => s.trim()).filter(Boolean);
const WIN = process.platform === 'win32', PYBIN = WIN ? 'python' : 'python3';
fs.mkdirSync(path.join(DATA, 'bots'), { recursive: true });

let TOKEN = process.env.RUNNER_TOKEN || '';
const tokenFile = path.join(DATA, 'token');
if (!TOKEN) {
  try { TOKEN = fs.readFileSync(tokenFile, 'utf8').trim(); } catch {}
  if (!TOKEN) { TOKEN = crypto.randomBytes(18).toString('hex'); fs.writeFileSync(tokenFile, TOKEN); }
}

const IGN = new Set(['node_modules', '.venv', '__pycache__', '.git']);
const RES = new Set(['.noxy.json', '.noxy.log']);
const bots = new Map(), VER = {};
let quitting = false;

const E = (code, msg) => Object.assign(new Error(msg), { code });
const bdir = id => path.join(DATA, 'bots', id);
const safe = (id, rel) => {
  const d = bdir(id), p = path.resolve(d, String(rel || '').replace(/^[\\/]+/, ''));
  if (p !== d && !p.startsWith(d + path.sep)) throw E(400, 'ruta inválida');
  if (RES.has(path.relative(d, p))) throw E(400, 'archivo reservado');
  return p;
};
const venvPy = d => path.join(d, '.venv', WIN ? 'Scripts' : 'bin', WIN ? 'python.exe' : 'python');
const save = b => fs.writeFileSync(path.join(bdir(b.meta.id), '.noxy.json'), JSON.stringify(b.meta, null, 2));

function log(b, s, m) {
  b.logs.push({ n: ++b.seq, t: Date.now(), s, m: String(m).slice(0, 4000) });
  if (b.logs.length > 3000) b.logs.splice(0, b.logs.length - 3000);
  fs.appendFile(path.join(bdir(b.meta.id), '.noxy.log'), `${new Date().toISOString()} [${s}] ${m}\n`, () => {});
}
function pipe(b, st, s) {
  let buf = '';
  st.on('data', d => { buf += d; let i; while ((i = buf.indexOf('\n')) >= 0) { log(b, s, buf.slice(0, i).replace(/\r$/, '')); buf = buf.slice(i + 1); } });
  st.on('end', () => { if (buf) log(b, s, buf); });
}
const envOf = b => { const e = { ...process.env, ...b.meta.env, PYTHONUNBUFFERED: '1', PYTHONIOENCODING: 'utf-8' }; delete e.RUNNER_TOKEN; return e; };
function run(b, cmd, args) {
  return new Promise(ok => {
    let p; try { p = cp.spawn(cmd, args, { cwd: bdir(b.meta.id), env: envOf(b), shell: WIN && /\.cmd$/.test(cmd) }); } catch (e) { log(b, 'err', e.message); return ok(1); }
    pipe(b, p.stdout, 'out'); pipe(b, p.stderr, 'err');
    p.on('error', e => { log(b, 'err', e.message); ok(1); });
    p.on('close', c => ok(c ?? 1));
  });
}
async function install(b, force) {
  const d = bdir(b.meta.id), m = b.meta;
  const h = f => { try { return crypto.createHash('md5').update(fs.readFileSync(path.join(d, f))).digest('hex'); } catch { return ''; } };
  if (m.runtime === 'python') {
    const rq = h('requirements.txt'); if (!rq) return 0;
    if (!fs.existsSync(venvPy(d))) { log(b, 'sys', 'Creando entorno virtual…'); const c = await run(b, PYBIN, ['-m', 'venv', '.venv']); if (c) return c; }
    if (force || rq !== m.dep) {
      log(b, 'sys', 'Instalando dependencias (pip)…');
      const c = await run(b, venvPy(d), ['-m', 'pip', 'install', '--disable-pip-version-check', '-r', 'requirements.txt']);
      if (c) return c; m.dep = rq; save(b);
    }
  } else {
    const pj = h('package.json'); if (!pj) return 0;
    if (force || pj !== m.dep || !fs.existsSync(path.join(d, 'node_modules'))) {
      log(b, 'sys', 'Instalando dependencias (npm)…');
      const c = await run(b, WIN ? 'npm.cmd' : 'npm', ['install', '--omit=dev', '--no-audit', '--no-fund']);
      if (c) return c; m.dep = pj; save(b);
    }
  }
  return 0;
}
async function start(b) {
  if (b.proc || b.busy) return;
  const d = bdir(b.meta.id);
  b.want = true; b.manual = false; b.meta.want = true; save(b); b.busy = true; b.status = 'installing';
  if (!b.meta.entry || !fs.existsSync(path.join(d, b.meta.entry))) {
    log(b, 'err', `No existe el archivo de entrada "${b.meta.entry}". Súbelo o elige otro en Ajustes.`);
    b.status = 'crashed'; b.busy = false; b.want = false; return;
  }
  const c = await install(b);
  if (c) { b.status = 'crashed'; b.busy = false; b.want = false; return log(b, 'err', `Falló la instalación de dependencias (código ${c}).`); }
  if (!b.want) { b.status = 'stopped'; b.busy = false; return; }
  const [cmd, args] = b.meta.runtime === 'node' ? ['node', [b.meta.entry]] : [fs.existsSync(venvPy(d)) ? venvPy(d) : PYBIN, ['-u', b.meta.entry]];
  log(b, 'sys', `Iniciando ${b.meta.entry}…`);
  let p;
  try { p = cp.spawn(cmd, args, { cwd: d, env: envOf(b) }); } catch (e) { b.status = 'crashed'; b.busy = false; return log(b, 'err', e.message); }
  b.proc = p; b.status = 'running'; b.startedAt = Date.now(); b.busy = false;
  pipe(b, p.stdout, 'out'); pipe(b, p.stderr, 'err');
  p.on('error', e => log(b, 'err', e.message));
  p.on('close', (code, sig) => {
    b.proc = null; b.startedAt = 0;
    log(b, 'sys', `Proceso terminado${code != null ? ` (código ${code})` : ''}${sig ? ` (${sig})` : ''}`);
    if (quitting) return;
    if (!b.want || b.manual) { b.status = 'stopped'; return; }
    b.status = code === 0 ? 'exited' : 'crashed';
    if (!b.meta.autorestart) return;
    const now = Date.now(); b.crashes = b.crashes.filter(t => now - t < 120000); b.crashes.push(now);
    if (b.crashes.length > 6) { log(b, 'sys', 'Demasiados fallos seguidos: se detuvo el reinicio automático.'); b.want = false; return; }
    const w = Math.min(30000, 1000 * 2 ** b.crashes.length);
    log(b, 'sys', `Reiniciando en ${w / 1000} s…`); b.restarts++;
    b.timer = setTimeout(() => { b.timer = null; if (b.want && !b.proc) start(b); }, w);
  });
}
function stop(b) {
  b.want = false; b.manual = true; b.meta.want = false; save(b); clearTimeout(b.timer); b.timer = null;
  if (b.proc) { const p = b.proc; log(b, 'sys', 'Deteniendo…'); p.kill('SIGTERM'); setTimeout(() => { try { p.kill('SIGKILL'); } catch {} }, 5000); }
  else b.status = 'stopped';
}
async function restart(b) { stop(b); for (let i = 0; i < 70 && b.proc; i++) await new Promise(r => setTimeout(r, 100)); start(b); }

const rss = pid => { if (!pid) return 0; try { const m = /VmRSS:\s+(\d+)/.exec(fs.readFileSync(`/proc/${pid}/status`, 'utf8')); return m ? Math.round(m[1] / 1024) : 0; } catch { return 0; } };
const view = b => ({ id: b.meta.id, name: b.meta.name, runtime: b.meta.runtime, entry: b.meta.entry, autorestart: !!b.meta.autorestart, status: b.status, pid: b.proc?.pid || 0, startedAt: b.startedAt, restarts: b.restarts, mem: rss(b.proc?.pid) });
function walk(d, base, out) {
  if (out.length > 2000) return;
  for (const e of fs.readdirSync(d, { withFileTypes: true })) {
    if (IGN.has(e.name) || (d === base && RES.has(e.name))) continue;
    const p = path.join(d, e.name);
    if (e.isDirectory()) walk(p, base, out);
    else { const s = fs.statSync(p); out.push({ path: path.relative(base, p).split(path.sep).join('/'), size: s.size, mtime: s.mtimeMs }); }
  }
}
function mk(meta) { return { meta, proc: null, logs: [], seq: 0, status: 'stopped', startedAt: 0, restarts: 0, crashes: [], want: false, manual: false, timer: null, busy: false }; }

function load() {
  for (const id of fs.readdirSync(path.join(DATA, 'bots'))) {
    try {
      const meta = JSON.parse(fs.readFileSync(path.join(bdir(id), '.noxy.json'), 'utf8')), b = mk(meta);
      meta.env = meta.env || {}; bots.set(id, b);
      try { if (fs.statSync(path.join(bdir(id), '.noxy.log')).size > 2e6) fs.writeFileSync(path.join(bdir(id), '.noxy.log'), ''); } catch {}
      if (meta.want) start(b);
    } catch {}
  }
}

const authed = req => { const t = (req.headers.authorization || '').replace(/^Bearer\s+/i, ''), a = Buffer.from(t), z = Buffer.from(TOKEN); return a.length === z.length && crypto.timingSafeEqual(a, z); };
const readBody = req => new Promise((ok, no) => {
  let n = 0; const c = [];
  req.on('data', d => { n += d.length; if (n > 64e6) { no(E(413, 'demasiado grande')); req.destroy(); } else c.push(d); });
  req.on('end', () => { try { ok(c.length ? JSON.parse(Buffer.concat(c)) : {}); } catch { no(E(400, 'JSON inválido')); } });
});

http.createServer(async (req, res) => {
  const o = req.headers.origin;
  if (o && (ORIGINS.includes('*') || ORIGINS.includes(o))) { res.setHeader('Access-Control-Allow-Origin', ORIGINS.includes('*') ? '*' : o); res.setHeader('Vary', 'Origin'); }
  res.setHeader('Access-Control-Allow-Headers', 'Authorization,Content-Type');
  res.setHeader('Access-Control-Allow-Methods', 'GET,POST,PUT,DELETE,OPTIONS');
  res.setHeader('Access-Control-Allow-Private-Network', 'true');
  if (req.method === 'OPTIONS') { res.writeHead(204); return res.end(); }
  const send = (c, j) => { res.writeHead(c, { 'Content-Type': 'application/json' }); res.end(JSON.stringify(j)); };
  try {
    const u = new URL(req.url, 'http://x'), seg = u.pathname.split('/').filter(Boolean), ok = authed(req), M = req.method;
    if (!seg.length || seg[0] === 'health') {
      return send(200, { ok: true, app: 'noxy-runner', v: '1.0.0', auth: ok, ...(ok ? { node: process.version, python: VER.py || null, platform: process.platform, uptime: Math.round(process.uptime()), bots: bots.size, mem: [Math.round((os.totalmem() - os.freemem()) / 1048576), Math.round(os.totalmem() / 1048576)], load: os.loadavg()[0] } : {}) });
    }
    if (!ok) return send(401, { error: 'token inválido' });
    if (seg[0] !== 'bots') throw E(404, 'no existe');
    if (seg.length === 1) {
      if (M === 'GET') return send(200, [...bots.values()].map(view));
      if (M === 'POST') {
        const j = await readBody(req), name = String(j.name || '').trim().slice(0, 40), runtime = j.runtime === 'node' ? 'node' : 'python';
        if (!name) throw E(400, 'pon un nombre');
        const id = crypto.randomBytes(4).toString('hex'); fs.mkdirSync(bdir(id), { recursive: true });
        const b = mk({ id, name, runtime, entry: runtime === 'node' ? 'index.js' : 'main.py', autorestart: true, env: {}, created: Date.now() });
        bots.set(id, b); save(b); return send(200, view(b));
      }
    }
    const b = bots.get(seg[1]); if (!b) throw E(404, 'bot no encontrado');
    const sub = seg[2], id = b.meta.id;
    if (!sub) {
      if (M === 'GET') return send(200, { ...view(b), env: b.meta.env });
      if (M === 'PUT') {
        const j = await readBody(req), m = b.meta;
        if (typeof j.name === 'string' && j.name.trim()) m.name = j.name.trim().slice(0, 40);
        if (j.runtime === 'python' || j.runtime === 'node') m.runtime = j.runtime;
        if (typeof j.entry === 'string') { safe(id, j.entry); m.entry = j.entry; }
        if (typeof j.autorestart === 'boolean') m.autorestart = j.autorestart;
        if (j.env && typeof j.env === 'object') { m.env = {}; for (const [k, v] of Object.entries(j.env)) if (/^[A-Za-z_][A-Za-z0-9_]*$/.test(k)) m.env[k] = String(v); }
        save(b); return send(200, view(b));
      }
      if (M === 'DELETE') { stop(b); for (let i = 0; i < 70 && b.proc; i++) await new Promise(r => setTimeout(r, 100)); fs.rmSync(bdir(id), { recursive: true, force: true }); bots.delete(id); return send(200, { ok: true }); }
    }
    if (M === 'POST' && sub === 'start') { start(b); return send(200, view(b)); }
